# Least-privilege identity used by .github/workflows/deploy-main.yaml to roll a new
# api-server image onto the box. Apply on the box:
#   kubectl apply -f hack/ci-deployer-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: stackdome-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: stackdome-control-plane
rules:
  - apiGroups: ["core.stackdome.io"]
    resources: ["stackresources"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: stackdome-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: stackdome-control-plane
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: stackdome-control-plane
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
