name: secret-app

resources:
  api:
    image: api:latest
    ports:
      - name: http
        port: 3000
        public: true
    env:
      LOG_LEVEL: info
    secrets:
      jwt-secret-id:
        JWT_SECRET: jwt_signing_key
      smtp-creds-id:
        SMTP_USER: username
        SMTP_PASS: password
