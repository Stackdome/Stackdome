[request_definition]
# Definition of access request parameters:
# subject: The user/entity making the request (e.g., user UUID)
# org: The organization context (e.g., org UUID)
# resource: The resource being accessed (e.g., User/123, Workspace/456)
# action: The operation being performed (e.g., read, write, update)
# resource_owner_id: The owner of the resource being accessed
r = subject, org, resource, action, resource_owner_id

[policy_definition]
# Definition of policy rule parameters (same structure as request)
p = subject, org, resource, action, resource_owner_id

[role_definition]
# Role inheritance definition with organization context
# Example: ('g', 'user123', 'User', 'org1') means user123 has User role in org1
g = _, _, _

[policy_effect]
# Policy effect definition: allow access if any policy rule matches
e = some(where (p.eft == allow))

[matchers]
# Complex matcher combining role-based and direct access patterns
# m = (
#    # Role-based access check
#    (
#        g(r.subject, p.subject, r.org) &&         # Check if requester has the required role
#        keyMatch2(r.resource, p.resource) &&       # Check if resource matches pattern
#        (p.org == "*" || r.org == p.org)           # Check organization boundary
#    )
#    || 
#    # Direct access check (used for delegated access) Ex: User1 grants User2 GET access to Workspace/workspace-123
#    (
#        r.subject == p.subject &&                   # Exact subject match
#        r.resource == p.resource &&                 # Exact resource match
#        r.org == p.org                             # Exact organization match
#    )
# ) && 
# # Action check: must match exactly or policy allows all actions (*)
# (r.action == p.action || p.action == "*") 
# && 
# # Resource ownership check:
# (
#    r.resource_owner_id == p.resource_owner_id ||   # Explicit owner match
#    r.resource_owner_id == r.subject ||            # Requester is owner
#    p.resource_owner_id == "*"                     # Policy allows any owner
# )
m = ((g(r.subject, p.subject, r.org) && keyMatch2(r.resource, p.resource) && (p.org == "*" || r.org == p.org)) || (r.subject == p.subject && r.resource == p.resource && r.org == p.org)) && \
(r.action == p.action || p.action == "*") && \
(r.resource_owner_id == p.resource_owner_id || r.resource_owner_id == r.subject ||  p.resource_owner_id == "*")