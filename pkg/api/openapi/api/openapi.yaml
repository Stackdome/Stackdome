      explode: false
      in: path
      name: team_name
      required: true
      schema:
        type: string
      style: simple
    user_id:
      description: The ID of the user
      explode: false
      in: path
      name: user_id
      required: true
      schema:
        type: string
      style: simple
    resource_name:
      description: The name of the stack resource
      explode: false
      in: path
      name: resource_name
      required: true
      schema:
        type: string
      style: simple
    connection_id:
      description: The ID of the stack connection
      explode: false
      in: path
      name: connection_id
      required: true
      schema:
        type: string
      style: simple
    build_id:
      description: The ID of the build
      explode: false
      in: path
      name: build_id
      required: true
      schema:
        type: string
      style: simple
    database:
      description: The name of the database
      explode: false
      in: path
      name: database
      required: true
      schema:
        type: string
      style: simple
  schemas:
    AppConfigResponse:
      example:
        github_oauth: true
      properties:
        github_oauth:
          description: True when GitHub OAuth login is configured on the server.
          type: boolean
      type: object
    Organisation:
      example:
        updated_at: 2000-01-23T04:56:07.000+00:00
        name: name
        domains:
        - fqdn: fqdn
          id: id
        - fqdn: fqdn
          id: id
        created_at: 2000-01-23T04:56:07.000+00:00
        id: id
        is_default: true
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          items:
            $ref: '#/components/schemas/DomainName'
          type: array
        is_default:
          type: boolean
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      type: object
    DomainName:
      example:
        fqdn: fqdn
        id: id
      properties:
        id:
          readOnly: true
          type: string
        fqdn:
          description: Fully Qualified Domain Name
          type: string
      type: object
    UserSignupResponse:
      example:
        refresh_token: refresh_token
        jwt_token: jwt_token
        user:
          organisation_id: organisation_id
          role: null
          teams:
          - role: Developer
            default_team: true
            team_id: team_id
            team_name: team_name
          - role: Developer
            default_team: true
            team_id: team_id
            team_name: team_name
          name: name
          organisation: organisation
          id: id
          email: email
          username: username
      properties:
        user:
          $ref: '#/components/schemas/User'
        jwt_token:
          description: JWT token for the authenticated user
          type: string
        refresh_token:
          description: Refresh token for obtaining new access tokens
          type: string
      type: object
    User:
      example:
        organisation_id: organisation_id
        role: null
        teams:
        - role: Developer
          default_team: true
          team_id: team_id
          team_name: team_name
        - role: Developer
          default_team: true
          team_id: team_id
