          description: Successful operation
        "404":
          description: WorkspaceStorage not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a specific WorkspaceStorage object
    put:
      parameters:
      - explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceStorage'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorage'
          description: WorkspaceStorage updated successfully
        "400":
          description: Invalid request payload
        "404":
          description: WorkspaceStorage not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Update a WorkspaceStorage object
