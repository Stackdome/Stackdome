        password: password
        name: name
        organisation: organisation
        email: email
        username: username
      properties:
        name:
          description: User's name
          type: string
        username:
          description: User's username
          type: string
        email:
          description: User's email address
          format: email
          type: string
        password:
          description: Users desired password
          type: string
        organisation:
          description: User's organisation
          type: string
        organisation_id:
          description: OrganisationID
          type: string
      required:
      - email
      - name
      - organisation_id
      - password
      type: object
    LoginRequest:
