openapi: 3.0.0
info:
  description: api-server
  title: api-server
  version: 0.0.1
servers:
- url: /
paths:
  /api/v1/users:
    post:
      description: Create a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request data
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: User already exists
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Create new user
  /api/v1/users/{id}:
    get:
      description: Get a user
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User fetched successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a user
  /api/v1/auth/login:
    post:
      description: Authenticate user and generate an access token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful login
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: User login
  /api/v1/workspace-provision-requests:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceProvisionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
          description: WorkspaceProvisionRequest added successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Create a new workpace provision request object
  /api/v1/workspace-provision-requests/{id}:
    delete:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: WorkspaceProvisionRequest deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: WorkspaceProvisionRequest not found
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Delete a WorkspaceProvisionRequest
    get:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
          description: WorkspaceProvisionRequest details
        "401":
          description: Unauthorized
        "404":
          description: WorkspaceProvisionRequest object not found
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a workspace provision request object by ID
    put:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceProvisionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
          description: WorkspaceProvisionRequest updated successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized
        "404":
          description: WorkspaceProvisionRequest not found
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Update a WorkspaceProvisionRequest
  /api/v1/clusters:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Cluster'
                type: array
          description: List of clusters
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Get all clusters
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cluster'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
          description: Cluster added successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Create a new cluster
  /api/v1/clusters/{id}:
    delete:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Cluster deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Cluster not found
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Delete a cluster
    get:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
          description: Cluster details
        "401":
          description: Unauthorized
        "404":
          description: Cluster not found
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a cluster by ID
    put:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cluster'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
          description: Cluster updated successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized
        "404":
          description: Cluster not found
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Update a cluster
components:
  parameters:
    id:
      description: The id of record
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
  schemas:
    User:
      example:
        organisation_id: 0
        role: role
        name: name
        organisation: organisation
        id: id
        email: email
        username: username
      properties:
        id:
          description: User's ID
          type: string
        name:
          description: User's name
          type: string
        username:
          description: User's username
          type: string
        email:
          description: User's email address
          format: email
          type: string
        organisation:
          description: User's organisation
          type: string
        role:
          description: User's role
          type: string
        organisation_id:
          description: OrganisationID
          type: integer
      type: object
    UserCreateRequest:
      example:
        organisation_id: 0
        password: password
        name: name
        organisation: organisation
        email: email
        username: username
      properties:
        name:
          description: User's name
          type: string
        username:
          description: User's username
          type: string
        email:
          description: User's email address
          format: email
          type: string
        password:
          description: Users desired password
          type: string
        organisation:
          description: User's organisation
          type: string
        organisation_id:
          description: OrganisationID
          type: integer
      required:
      - email
      - name
      - organisation_id
      - password
      type: object
    LoginRequest:
      example:
        password: password
        email: email
      properties:
        email:
          description: User's email
          type: string
        password:
          description: User's password
          format: password
          type: string
      required:
      - email
      - password
      type: object
    LoginResponse:
      example:
        expires_in: 0
        token: token
      properties:
        token:
          description: Access token for authenticated requests
          type: string
        expires_in:
          description: Token expiration time in seconds
          type: integer
      type: object
    ProvisionRequestStatus:
      properties:
        status_condition:
          $ref: '#/components/schemas/ProvisionRequestStatusCondition'
        message:
          type: string
      type: object
    ProvisionRequestStatusCondition:
      enum:
      - Pending
      - Completed
      - Error
      type: string
    WorkspaceProvisionRequest:
      example:
        ssh_public_key: ssh_public_key
        updated_at: 2000-01-23T04:56:07.000+00:00
        user_id: user_id
        org_id: 0
        created_at: 2000-01-23T04:56:07.000+00:00
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status:
          workspace_namespace: workspace_namespace
          cluster_url: cluster_url
          storageserver_sshusername: storageserver_sshusername
          workspace_service_accountname: workspace_service_accountname
          workspace_serviceaccount_token: workspace_serviceaccount_token
          cluster_ca_cert: cluster_ca_cert
          status_condition: null
          message: message
      properties:
        id:
          format: uuid
          type: string
        user_id:
          type: string
        org_id:
          type: integer
        ssh_public_key:
          type: string
        status:
          $ref: '#/components/schemas/WorkspaceProvisionRequestStatus'
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - ssh_public_key
      type: object
    WorkspaceProvisionRequestStatus:
      example:
        workspace_namespace: workspace_namespace
        cluster_url: cluster_url
        storageserver_sshusername: storageserver_sshusername
        workspace_service_accountname: workspace_service_accountname
        workspace_serviceaccount_token: workspace_serviceaccount_token
        cluster_ca_cert: cluster_ca_cert
        status_condition: null
        message: message
      properties:
        workspace_namespace:
          nullable: true
          type: string
        workspace_service_accountname:
          nullable: true
          type: string
        workspace_serviceaccount_token:
          nullable: true
          type: string
        storageserver_sshusername:
          nullable: true
          type: string
        cluster_ca_cert:
          nullable: true
          type: string
        cluster_url:
          nullable: true
          type: string
        status_condition:
          $ref: '#/components/schemas/ProvisionRequestStatusCondition'
        message:
          nullable: true
          type: string
      required:
      - status
      type: object
    Cluster:
      example:
        cluster_url: cluster_url
        cluster_ca_data: cluster_ca_data
        organisation_id: organisation_id
        default: true
        name: name
        client_cert_data: client_cert_data
        client_key_data: client_key_data
        id: id
      properties:
        id:
          type: string
        name:
          type: string
        organisation_id:
          type: string
        default:
          type: boolean
        cluster_url:
          type: string
        cluster_ca_data:
          type: string
        client_cert_data:
          type: string
        client_key_data:
          type: string
      type: object
    Error:
      allOf:
      - $ref: '#/components/schemas/ObjectReference'
      - $ref: '#/components/schemas/Error_allOf'
    ErrorList:
      allOf:
      - $ref: '#/components/schemas/List'
      properties:
        items:
          items:
            $ref: '#/components/schemas/Error'
          type: array
      type: object
    List:
      properties:
        kind:
          type: string
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
      required:
      - items
      - kind
      - page
      - size
      - total
      type: object
    ObjectReference:
      properties:
        id:
          type: string
        kind:
          type: string
        href:
          type: string
      type: object
    Error_allOf:
      properties:
        code:
          type: string
        reason:
          type: string
        operation_id:
          type: string
      type: object
