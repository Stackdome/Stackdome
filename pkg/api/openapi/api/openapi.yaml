          - volume
          - object_store
          type: string
        id:
          description: Stable ID for persisted resources such as addons or secrets.
          type: string
        name:
          description: Name-scoped reference for stack-local resources such as StackResources
            or Volumes.
          type: string
      required:
      - type
      type: object
    ConnectionMapping:
      description: Maps one produced value into one target location on the consumer.
      example:
        value:
          output: output
          template: template
          values:
            key:
              output: output
        target:
          path: path
          name: name
          type: env
      properties:
        target:
          $ref: '#/components/schemas/ConnectionTarget'
        value:
          $ref: '#/components/schemas/ValueRef'
      required:
