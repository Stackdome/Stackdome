        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a specific team by name
    put:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The name of the team
        explode: false
        in: path
        name: team_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: Team updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request data
        "401":
          description: Unauthorized
        "404":
          description: Team not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Update a team
  /api/v1/organizations/{org_id}/teams/{team_name}/members:
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The name of the team
        explode: false
        in: path
        name: team_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembershipList'
          description: Successful operation
        "401":
          description: Unauthorized
        "404":
