openapi: 3.0.0
info:
  description: stackdome-api-server
  title: stackdome-api-server
  version: 0.0.1
servers:
- url: /
paths:
  /api/v1/users:
    post:
      description: Create a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request data
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: User already exists
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Create new user
  /api/v1/users/{id}:
    get:
      description: Get a user
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User fetched successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a user
  /api/v1/users/me:
    get:
      description: Get a the current authenticated user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User fetched successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a the current authenticated user
  /api/v1/auth/login:
    post:
      description: Authenticate user and generate an access token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful login
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: User login
  /api/v1/workspace-provision-requests:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceProvisionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
          description: WorkspaceProvisionRequest added successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Create a new workpace provision request object
  /api/v1/workspace-provision-requests/current:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
          description: WorkspaceProvisionRequest details
        "401":
          description: Unauthorized
        "404":
          description: WorkspaceProvisionRequest object not found
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Get the current users workspace provision request object.
  /api/v1/workspace-provision-requests/{id}:
    delete:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: WorkspaceProvisionRequest deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: WorkspaceProvisionRequest not found
        "500":
          description: Internal server error
