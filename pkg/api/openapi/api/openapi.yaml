        name:
          description: Environment variable name when type is env.
          type: string
        path:
          description: Absolute file path when type is file.
          type: string
      required:
      - type
      type: object
    StackConnectionConfig:
      description: "Kind-specific connection configuration. The shape depends on the\
        \ connection kind and source type: use PostgresEnvConfig when kind is env\
        \ and from.type is addon/postgres, VolumeMountConfig when kind is volume_mount,\
        \ and BuildArtifactSourceConfig when kind is build_artifact_source. Omit config\
        \ entirely for env connections from stack_resource or secret sources.\n"
      oneOf:
      - $ref: '#/components/schemas/PostgresEnvConfig'
      - $ref: '#/components/schemas/VolumeMountConfig'
      - $ref: '#/components/schemas/BuildArtifactSourceConfig'
    PostgresEnvConfig:
      additionalProperties: false
      description: "Config for env connections from a PostgreSQL addon (kind=env,\
        \ from.type=addon/postgres). credential_scope and superuser are mutually exclusive.\n"
      properties:
        database:
          description: Target database name within the addon.
          type: string
        credential_scope:
          description: Which credential set to inject. Mutually exclusive with superuser.
          enum:
          - owner
          - superuser
          type: string
        superuser:
          description: Use superuser credentials. Mutually exclusive with credential_scope.
          type: boolean
      type: object
    VolumeMountConfig:
      additionalProperties: false
      description: Config for volume mount connections (kind=volume_mount).
      properties:
        mount_path:
          description: Absolute path where the volume is mounted in the container.
          type: string
        sub_path:
          description: Sub-path within the volume to mount.
          type: string
        read_only:
          description: Mount the volume read-only.
          type: boolean
      required:
      - mount_path
      type: object
    BuildArtifactSourceConfig:
      additionalProperties: false
      description: Config for build artifact source connections (kind=build_artifact_source).
      properties:
        source_path:
          description: Path within the build output to copy from.
          type: string
        destination_path:
          description: Path within the volume to copy to.
          type: string
      required:
      - source_path
      type: object
    ValueRef:
      description: "Describes how to read a value from the connection's `from` node.\
        \ This is only used inside `StackConnection.mappings[]`.\n"
      example:
        output: output
        template: template
        values:
          key:
            output: output
      properties:
        output:
