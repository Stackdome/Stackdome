            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: List all teams in an organization
    post:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: Team created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request data
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Create a new team
  /api/v1/organizations/{org_id}/teams/{team_name}:
    delete:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The name of the team
        explode: false
        in: path
        name: team_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Team deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Team not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Delete a team
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The name of the team
        explode: false
        in: path
        name: team_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: Successful operation
        "401":
          description: Unauthorized
        "404":
