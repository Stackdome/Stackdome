      summary: Get a workspace provision request object by ID
    put:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceProvisionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
          description: WorkspaceProvisionRequest updated successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized
        "404":
          description: WorkspaceProvisionRequest not found
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Update a WorkspaceProvisionRequest
  /api/v1/organizations/{id}/workspace-storages:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: workspaceName
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: state
        required: false
        schema:
          enum:
          - Pending
          - Creating
          - Created
          - Failed
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_v1_organizations__id__workspace_storages_get_200_response'
          description: Successful operation
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: List all WorkspaceStorage objects for an organization
    post:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceStorage'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorage'
          description: WorkspaceStorage created successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Create a new WorkspaceStorage object
  /api/v1/organizations/{org_id}/workspace-storages/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
