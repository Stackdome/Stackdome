name: stackdome

resources:
  api-server:
    build:
      repo: https://github.com/Stackdome/stackdome
      branch: main
      dockerfile: Dockerfile.preview
      context: .
    command: ["sh", "-c"]
    args: ["./stackdome-server migrate && ./stackdome-server serve"]
    ports:
      - name: http
        port: 8000
        public: true
        subdomain: stackdome
    env:
      DB_HOST: "{{ db.host }}"
      DB_PORT: "5432"
      DB_NAME: stackdome
      DB_USERNAME: stackdome
      DB_PASSWORD: stackdome-preview
      JWT_SECRET: 358bf580cb24f862bcc6bf7decba810f179fe971ccd8d72da3a58e43f72c989a
      ENCRYPTION_KEY: 96c65f672796aa1bb290c2ce93b142def6c637a59dcff97c4b37d0b68da39897
      LOG_LEVEL: info
    depends_on: [db]

  db:
    image: postgres:16-alpine
    ports:
      - name: postgres
        port: 5432
    env:
      POSTGRES_DB: stackdome
      POSTGRES_USER: stackdome
      POSTGRES_PASSWORD: stackdome-preview
    volumes:
      - name: db-data
        path: /var/lib/postgresql/data

volumes:
  db-data:
    size: 5Gi
