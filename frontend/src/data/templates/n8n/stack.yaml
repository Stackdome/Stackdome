# n8n with Postgres.
# Config from n8n's official Kubernetes manifests + docker-compose/withPostgres
# (github.com/n8n-io/n8n-hosting), simplified for Stackdome:
#   - no Traefik (platform owns ingress/TLS/domains)
#   - n8n connects as the single `n8n` Postgres superuser (no init-script split)
#   - N8N_ENCRYPTION_KEY auto-generated by n8n and persisted on the n8n_data volume
# Replace the two `replace-with-…` passwords (they must match) before deploying.
name: n8n
services:
  n8n:
    image: n8nio/n8n:2.27.4
    ports:
      - "5678:5678"
    depends_on:
      - postgres
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "replace-with-a-strong-password"
      N8N_PROTOCOL: "http"
      N8N_PORT: "5678"
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: "replace-with-a-strong-password"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - n8n_db:/var/lib/postgresql/data

volumes:
  n8n_data:
  n8n_db:
