# OpenClaw — self-hosted AI assistant gateway (single container, no external DB).
# Adapted from github.com/openclaw/openclaw docker-compose.yml, flattened for Stackdome:
#   - uses the published GHCR image (no local build)
#   - binds LAN so the Control UI is reachable through the platform ingress
#   - skips interactive onboarding; the deployer sets the token + provider key below
#   - state, config, and workspace persist on the openclaw-data volume (/home/node/.openclaw)
# Replace REPLACE_OPENCLAW_GATEWAY_TOKEN_VALUE_HERE (openssl rand -hex 32) and
# REPLACE_ANTHROPIC_API_KEY_VALUE_HERE before deploying. A remote Control UI also
# needs one-time device pairing (openclaw devices approve) after the first connect.
name: openclaw
services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.6.10
    ports:
      - "18789:18789"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_SKIP_ONBOARDING: "1"
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_GATEWAY_TOKEN: "REPLACE_OPENCLAW_GATEWAY_TOKEN_VALUE_HERE"
      ANTHROPIC_API_KEY: "REPLACE_ANTHROPIC_API_KEY_VALUE_HERE"
      TZ: UTC
    volumes:
      - openclaw-data:/home/node/.openclaw

volumes:
  openclaw-data:
