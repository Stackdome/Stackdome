# OpenClaw — self-hosted AI assistant gateway. Single container, no DB. Boot-verified.
# Startup command seeds gateway.mode=local + auth.mode=token into openclaw.json on the volume,
# then starts the gateway. The gateway refuses to boot without that config and Stackdome's
# converter can't mount a ConfigMap (the upstream k8s init-container approach) — do not drop it.
# bind=lan: reachable via ingress (default is loopback-only).
# Replace both REPLACE_* secrets. Default model openai/gpt-5.5 -> OPENAI_API_KEY (Claude needs a model override).
# Post-deploy once: `openclaw devices approve`; add your domain to gateway.controlUi.allowedOrigins (localhost-only since v2026.2.26).
name: openclaw
services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.6.10
    command:
      - sh
      - -c
      - openclaw config set gateway.mode local && openclaw config set gateway.auth.mode token && exec node openclaw.mjs gateway
    ports:
      - "18789:18789"
    environment:
      OPENCLAW_SKIP_ONBOARDING: "1"
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_TOKEN: "REPLACE_OPENCLAW_GATEWAY_TOKEN_VALUE_HERE"
      OPENAI_API_KEY: "REPLACE_OPENAI_API_KEY_VALUE_HERE"
    volumes:
      - openclaw-data:/home/node/.openclaw

volumes:
  openclaw-data:
