# Immich — photo & video backup. The database MUST be the immich vector Postgres (VectorChord +
# pgvector) — plain postgres won't work. Replace both REPLACE_DB_PASSWORD_VALUE_HERE (must match).
name: immich
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v2.7.5
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: "REPLACE_DB_PASSWORD_VALUE_HERE"
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    volumes:
      - immich-upload:/data

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5
    volumes:
      - model-cache:/cache

  redis:
    image: valkey/valkey:9

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "REPLACE_DB_PASSWORD_VALUE_HERE"
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - immich-db:/var/lib/postgresql/data

volumes:
  immich-upload:
  model-cache:
  immich-db:
