# n8n + Postgres. Replace both REPLACE_POSTGRES_PASSWORD_VALUE_HERE (must match).
name: n8n
services:
  n8n:
    image: n8nio/n8n:2.27.4
    ports:
      - "5678:5678"
    depends_on:
      - postgres
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "REPLACE_POSTGRES_PASSWORD_VALUE_HERE"
      N8N_PROTOCOL: "http"
      N8N_PORT: "5678"
    volumes:
      - n8n-data:/home/node/.n8n

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: "REPLACE_POSTGRES_PASSWORD_VALUE_HERE"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - n8n-db:/var/lib/postgresql/data

volumes:
  n8n-data:
  n8n-db:
