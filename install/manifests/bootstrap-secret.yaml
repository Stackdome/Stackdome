apiVersion: v1
kind: Secret
metadata:
  name: stackdome-bootstrap-secrets
  namespace: stackdome-control-plane
  labels:
    app.kubernetes.io/part-of: stackdome-platform
    app.kubernetes.io/managed-by: stackdome-installer
    stackdome.io/bootstrap: "true"
type: Opaque
stringData:
  db-password: "{{.DBPassword}}"
  jwt-secret: "{{.JWTSecret}}"
  encryption-key: "{{.EncryptionKey}}"
  admin-password: "{{.AdminPassword}}"
  admin-email: "{{.AdminEmail}}"
  domain: "{{.Domain}}"
  github-client-id: "{{.GitHubClientID}}"
  github-client-secret: "{{.GitHubClientSecret}}"
  github-app-id: "{{.GitHubAppID}}"
  github-app-slug: "{{.GitHubAppSlug}}"
  github-app-private-key: {{yamlStr .GitHubAppPrivateKey}}
  github-app-webhook-secret: "{{.GitHubAppWebhookSecret}}"
