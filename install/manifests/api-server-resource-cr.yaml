apiVersion: core.stackdome.io/v1alpha1
kind: StackResource
metadata:
  name: api-server
  namespace: stackdome-control-plane
  labels:
    app.kubernetes.io/part-of: stackdome-platform
    app.kubernetes.io/managed-by: stackdome-installer
    stackdome.io/bootstrap: "true"
    stackdome.io/stack-name: stackdome-platform
  ownerReferences:
    - apiVersion: core.stackdome.io/v1alpha1
      kind: Stack
      name: stackdome-platform
      uid: "{{.StackUID}}"
  {{- if .TLSEnabled }}
  annotations:
    core.stackdome.io/cluster-issuer: letsencrypt-prod
  {{- end }}
spec:
  workloadType: Service
  imageSpec:
    image: "{{.APIServerImage}}"
  init:
    command: ["./stackdome-server", "migrate"]
  command: ["./stackdome-server"]
  args: ["serve"]
  dependsOn:
    - db
  ports:
    - name: http
      number: 8000
      protocol: http
      exposeToPublic: true
      fqdn: "{{.Domain}}"
      tls: {{.TLSEnabled}}
  environmentVariables:
    - name: STACKDOME_ENV
      value: PRODUCTION
    - name: DB_HOST
      value: db.stackdome-control-plane.svc.cluster.local
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: stackdome
    - name: DB_USERNAME
      value: stackdome
    - name: DB_PASSWORD
      value: "{{.DBPassword}}"
    - name: JWT_SECRET
      value: "{{.JWTSecret}}"
    - name: ENCRYPTION_KEY
      value: "{{.EncryptionKey}}"
    - name: LOG_LEVEL
      value: info
    - name: SERVER_EXTERNAL_URL
      value: "{{if .TLSEnabled}}https{{else}}http{{end}}://{{.Domain}}"
    {{- if .Platform.Enabled }}
    - name: PLATFORM_CLUSTER_API_URL
      valueFrom:
        secretKeyRef:
          name: stackdome-bootstrap-secrets
          key: platform-cluster-api-url
    - name: PLATFORM_CLUSTER_CA_DATA
      valueFrom:
        secretKeyRef:
          name: stackdome-bootstrap-secrets
          key: platform-cluster-ca-data
    - name: PLATFORM_CLUSTER_TOKEN
      valueFrom:
        secretKeyRef:
          name: stackdome-bootstrap-secrets
          key: platform-cluster-token
    - name: PLATFORM_EMAIL
      valueFrom:
        secretKeyRef:
          name: stackdome-bootstrap-secrets
          key: admin-email
    - name: PLATFORM_BASE_DOMAIN
      valueFrom:
        secretKeyRef:
          name: stackdome-bootstrap-secrets
          key: platform-base-domain
    - name: PLATFORM_DNS_CLOUDFLARE_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: stackdome-bootstrap-secrets
          key: platform-cloudflare-api-token
    - name: PLATFORM_ACME_ENVIRONMENT
      valueFrom:
        secretKeyRef:
          name: stackdome-bootstrap-secrets
          key: platform-acme-environment
    - name: PLATFORM_CONFIG_REVISION
      value: "{{.Platform.Revision}}"
    {{- end }}
    {{- if .GitHubClientID }}
    - name: GITHUB_CLIENT_ID
      value: "{{.GitHubClientID}}"
    - name: GITHUB_CLIENT_SECRET
      value: "{{.GitHubClientSecret}}"
    {{- end }}
    {{- if .GitHubAppID }}
    - name: GITHUB_APP_ID
      value: "{{.GitHubAppID}}"
    - name: GITHUB_APP_SLUG
      value: "{{.GitHubAppSlug}}"
    - name: GITHUB_APP_PRIVATE_KEY
      value: {{yamlStr .GitHubAppPrivateKey}}
    - name: GITHUB_APP_WEBHOOK_SECRET
      value: "{{.GitHubAppWebhookSecret}}"
    {{- end }}
