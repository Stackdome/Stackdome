name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  STACKDOME_URL: https://stackdome.io
  TEAM_NAME: default
  CONFIG_NAME: stackdome-previews
  REPO_URL: https://github.com/Stackdome/stackdome

permissions:
  pull-requests: write

jobs:
  preview-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Login to StackDome
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST "$STACKDOME_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.STACKDOME_EMAIL }}\",\"password\":\"${{ secrets.STACKDOME_PASSWORD }}\"}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          ORG_ID=$(echo "$RESPONSE" | jq -r '.user.organisation_id')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Login failed: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure preview config exists
        id: config
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG_ID: ${{ steps.auth.outputs.org_id }}
          GIT_SECRET_NAME: ${{ secrets.STACKDOME_GIT_SECRET_NAME }}
        run: |
          API_BASE="$STACKDOME_URL/api/v1/organizations/$ORG_ID/teams/$TEAM_NAME"

          CONFIG_ID=$(curl -s "$API_BASE/stack-preview-configs" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r ".items[] | select(.name == \"$CONFIG_NAME\") | .id")

          if [ -z "$CONFIG_ID" ] || [ "$CONFIG_ID" = "null" ]; then
            # Resolve git secret ID by name
            GIT_SECRET_REF=""
            if [ -n "$GIT_SECRET_NAME" ]; then
              GIT_SECRET_ID=$(curl -s "$API_BASE/secrets" \
                -H "Authorization: Bearer $TOKEN" \
                | jq -r ".items[] | select(.name == \"$GIT_SECRET_NAME\") | .id")
              if [ -n "$GIT_SECRET_ID" ] && [ "$GIT_SECRET_ID" != "null" ]; then
                GIT_SECRET_REF=",\"git_secret_ref\":\"$GIT_SECRET_ID\""
                echo "Found git secret: $GIT_SECRET_ID"
              else
                echo "Warning: git secret '$GIT_SECRET_NAME' not found"
              fi
            fi

            echo "Creating preview config..."
            RESPONSE=$(curl -s -X POST "$API_BASE/stack-preview-configs" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$CONFIG_NAME\",\"git_repository\":{\"repo_url\":\"$REPO_URL\",\"base_branch\":\"main\"$GIT_SECRET_REF},\"stackfile_path\":\"stackfile.yaml\",\"max_active_previews\":2}")
            CONFIG_ID=$(echo "$RESPONSE" | jq -r '.id')
            if [ -z "$CONFIG_ID" ] || [ "$CONFIG_ID" = "null" ]; then
              echo "Failed to create config: $RESPONSE"
              exit 1
            fi
            echo "Created config: $CONFIG_ID"
          else
            echo "Found existing config: $CONFIG_ID"
          fi

          echo "config_id=$CONFIG_ID" >> "$GITHUB_OUTPUT"

      - name: Create or sync preview
        id: preview
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG_ID: ${{ steps.auth.outputs.org_id }}
          CONFIG_ID: ${{ steps.config.outputs.config_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          API_BASE="$STACKDOME_URL/api/v1/organizations/$ORG_ID/teams/$TEAM_NAME"

          PREVIEW_ID=$(curl -s "$API_BASE/preview-stacks" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r ".items[] | select(.pr_number == \"$PR_NUMBER\") | .id")

          if [ -n "$PREVIEW_ID" ] && [ "$PREVIEW_ID" != "null" ]; then
            echo "Syncing existing preview $PREVIEW_ID..."
            curl -s -X POST "$API_BASE/preview-stacks/$PREVIEW_ID/sync" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{}"
          else
            echo "Creating preview for PR #$PR_NUMBER (branch: $BRANCH, commit: $COMMIT_SHA)..."
            RESPONSE=$(curl -s -X POST "$API_BASE/preview-stacks" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"config_id\":\"$CONFIG_ID\",\"pr_number\":\"$PR_NUMBER\",\"branch\":\"$BRANCH\",\"commit\":\"$COMMIT_SHA\"}")
            PREVIEW_ID=$(echo "$RESPONSE" | jq -r '.id')
            if [ -z "$PREVIEW_ID" ] || [ "$PREVIEW_ID" = "null" ]; then
              echo "Failed to create preview: $RESPONSE"
              exit 1
            fi
            echo "Created preview: $PREVIEW_ID"
          fi

          echo "preview_id=$PREVIEW_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for preview to be ready
        id: status
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG_ID: ${{ steps.auth.outputs.org_id }}
          PREVIEW_ID: ${{ steps.preview.outputs.preview_id }}
        run: |
          API_BASE="$STACKDOME_URL/api/v1/organizations/$ORG_ID/teams/$TEAM_NAME"
          TIMEOUT=900
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            RESPONSE=$(curl -s "$API_BASE/preview-stacks/$PREVIEW_ID" \
              -H "Authorization: Bearer $TOKEN")

            PHASE=$(echo "$RESPONSE" | jq -r '.status.phase // "unknown"')
            echo "Phase: $PHASE (${ELAPSED}s elapsed)"

            if [ "$PHASE" = "Ready" ]; then
              URLS=$(echo "$RESPONSE" | jq -c '.status.outputs.urls // []')
              COMMIT=$(echo "$RESPONSE" | jq -r '.status.outputs.commit_sha // ""')
              echo "urls=$URLS" >> "$GITHUB_OUTPUT"
              echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
              echo "phase=Ready" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$PHASE" = "Failed" ]; then
              MESSAGE=$(echo "$RESPONSE" | jq -r '.status.message // "unknown error"')
              echo "Preview failed: $MESSAGE"
              echo "phase=Failed" >> "$GITHUB_OUTPUT"
              echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          echo "Timed out waiting for preview to be ready"
          echo "phase=Timeout" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Post preview URL to PR
        if: steps.status.outputs.phase == 'Ready'
        uses: actions/github-script@v7
        env:
          PREVIEW_URLS: ${{ steps.status.outputs.urls }}
          PREVIEW_COMMIT: ${{ steps.status.outputs.commit }}
        with:
          script: |
            const marker = '<!-- stackdome-preview -->';
            const urls = JSON.parse(process.env.PREVIEW_URLS || '[]');
            const commit = process.env.PREVIEW_COMMIT || 'unknown';

            let urlTable = '| Resource | URL |\n|----------|-----|\n';
            for (const u of urls) {
              urlTable += `| ${u.resource} | ${u.url} |\n`;
            }

            const body = [
              marker,
              '### Preview Environment',
              '',
              urlTable,
              `**Commit:** \`${commit.substring(0, 7)}\``,
              `**Status:** Ready`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  preview-cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Login to StackDome
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST "$STACKDOME_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.STACKDOME_EMAIL }}\",\"password\":\"${{ secrets.STACKDOME_PASSWORD }}\"}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          ORG_ID=$(echo "$RESPONSE" | jq -r '.user.organisation_id')

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"

      - name: Delete preview
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG_ID: ${{ steps.auth.outputs.org_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          API_BASE="$STACKDOME_URL/api/v1/organizations/$ORG_ID/teams/$TEAM_NAME"

          CONFIG_ID=$(curl -s "$API_BASE/stack-preview-configs" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r ".items[] | select(.name == \"$CONFIG_NAME\") | .id")

          if [ -z "$CONFIG_ID" ] || [ "$CONFIG_ID" = "null" ]; then
            echo "No preview config found, nothing to clean up"
            exit 0
          fi

          PREVIEW_ID=$(curl -s "$API_BASE/preview-stacks" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r ".items[] | select(.pr_number == \"$PR_NUMBER\") | .id")

          if [ -n "$PREVIEW_ID" ] && [ "$PREVIEW_ID" != "null" ]; then
            echo "Deleting preview $PREVIEW_ID..."
            curl -s -X DELETE "$API_BASE/preview-stacks/$PREVIEW_ID" \
              -H "Authorization: Bearer $TOKEN"
            echo "Preview deleted"
          else
            echo "No preview found for PR #$PR_NUMBER"
          fi

      - name: Remove PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- stackdome-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }
