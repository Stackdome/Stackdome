name: Build and Push Image

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_REPO: ${{ vars.IMAGE_REPO || 'quay.io/stackdome/stackdome' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: make frontend

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/linux_amd64/stackdome-server cmd/main.go

      - name: Login to Quay.io
        run: echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin

      - name: Build and push image
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          docker build -t ${{ env.IMAGE_REPO }}:${VERSION} .
          docker tag ${{ env.IMAGE_REPO }}:${VERSION} ${{ env.IMAGE_REPO }}:latest
          docker push ${{ env.IMAGE_REPO }}:${VERSION}
          docker push ${{ env.IMAGE_REPO }}:latest

      - name: Build installer binaries
        run: |
          make installer-linux-amd64
          make installer-linux-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/stackdome-install-linux-amd64
            bin/stackdome-install-linux-arm64
          generate_release_notes: true
