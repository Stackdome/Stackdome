name: Deploy main to box

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tag to deploy, e.g. main-abc1234 (rollback). Empty = build from this ref."
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: ${{ vars.IMAGE_REPO || 'quay.io/stackdome/stackdome' }}

jobs:
  gate:
    name: unit tests & lint
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Unit tests
        run: mage test:unit
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          # Stale analysis cache corrupts staticcheck's noreturn facts,
          # producing false SA5011 on `if x == nil { t.Fatal }` patterns.
          skip-cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Frontend lint
        run: pnpm lint
        working-directory: frontend

      - name: Frontend test
        run: pnpm test:run
        working-directory: frontend

  build:
    name: build & push amd64 image
    if: ${{ inputs.image_tag == '' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Compute image reference
        id: meta
        run: |
          SHA7="${GITHUB_SHA::7}"
          echo "sha7=$SHA7" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPO}:main-${SHA7}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: make frontend

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/linux_amd64/stackdome-server cmd/main.go
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        run: echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${IMAGE_REPO}:main" \
            --push .

      - name: Verify pushed image
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.image }}"

  deploy:
    name: upgrade box & wait for convergence
    needs: build
    if: ${{ !cancelled() && (inputs.image_tag != '' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      # Carries the compiled-in agent chart version, so the box lands on the
      # chart this commit expects. Built here rather than reused from the build
      # job because rollback dispatches skip that job entirely.
      - name: Build installer
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/stackdome-install ./cmd/installer
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - name: Configure SSH
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$BOX_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$BOX_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
          BOX_SSH_KNOWN_HOSTS: ${{ secrets.BOX_SSH_KNOWN_HOSTS }}

      - name: Upload installer
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          scp $SSH_OPTS bin/stackdome-install hack/wait-for-stackresource.sh \
            "$BOX_SSH_USER@$BOX_SSH_HOST:/usr/local/bin/"
        env:
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
          BOX_SSH_USER: ${{ vars.BOX_SSH_USER || 'root' }}

      - name: Upgrade box & wait for convergence
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          if [ -n "${INPUT_TAG:-}" ]; then
            IMAGE="${IMAGE_REPO}:${INPUT_TAG}"
          else
            IMAGE="$BUILT_IMAGE"
          fi
          echo "deploying $IMAGE"
          ssh $SSH_OPTS "$BOX_SSH_USER@$BOX_SSH_HOST" bash -s <<EOF
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          chmod +x /usr/local/bin/stackdome-install /usr/local/bin/wait-for-stackresource.sh
          stackdome-install upgrade --image "$IMAGE"
          GEN=\$(kubectl get stackresource api-server -n stackdome-control-plane -o jsonpath='{.metadata.generation}')
          wait-for-stackresource.sh api-server stackdome-control-plane "\$GEN" 600
          EOF
        env:
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
          BOX_SSH_USER: ${{ vars.BOX_SSH_USER || 'root' }}
          BUILT_IMAGE: ${{ needs.build.outputs.image }}
          INPUT_TAG: ${{ inputs.image_tag }}
          IMAGE_REPO: ${{ vars.IMAGE_REPO || 'quay.io/stackdome/stackdome' }}
