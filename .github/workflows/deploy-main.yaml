name: Deploy main to box

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tag to deploy, e.g. main-abc1234 (rollback). Empty = build from this ref."
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: ${{ vars.IMAGE_REPO || 'quay.io/stackdome/stackdome' }}

jobs:
  gate:
    name: unit tests & lint
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Unit tests
        run: mage test:unit
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          # Stale analysis cache corrupts staticcheck's noreturn facts,
          # producing false SA5011 on `if x == nil { t.Fatal }` patterns.
          skip-cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Frontend lint
        run: pnpm lint
        working-directory: frontend

      - name: Frontend test
        run: pnpm test:run
        working-directory: frontend

  build:
    name: build & push amd64 image
    if: ${{ inputs.image_tag == '' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Compute image reference
        id: meta
        run: |
          SHA7="${GITHUB_SHA::7}"
          echo "sha7=$SHA7" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPO}:main-${SHA7}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: make frontend

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/linux_amd64/stackdome-server cmd/main.go
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        run: echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${IMAGE_REPO}:main" \
            --push .

      - name: Verify pushed image
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.image }}"

  deploy:
    name: upgrade box & wait for convergence
    needs: build
    if: ${{ !cancelled() && (inputs.image_tag != '' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      # Carries the compiled-in agent chart version, so the box lands on the
      # chart this commit expects. Built here rather than reused from the build
      # job because rollback dispatches skip that job entirely.
      - name: Build installer
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/stackdome-install ./cmd/installer
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - name: Configure SSH
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$BOX_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$BOX_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
          BOX_SSH_KNOWN_HOSTS: ${{ secrets.BOX_SSH_KNOWN_HOSTS }}

      - name: Upload installer
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          scp $SSH_OPTS bin/stackdome-install hack/wait-for-stackresource.sh \
            "$BOX_SSH_USER@$BOX_SSH_HOST:/usr/local/bin/"
        env:
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
          BOX_SSH_USER: ${{ vars.BOX_SSH_USER || 'root' }}

      - name: Upgrade box & wait for convergence
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          if [ -n "${INPUT_TAG:-}" ]; then
            IMAGE="${IMAGE_REPO}:${INPUT_TAG}"
          else
            IMAGE="$BUILT_IMAGE"
          fi
          echo "deploying $IMAGE"

          PLATFORM_CONFIGURED=false
          REMOTE_TOKEN_FILE=""
          cleanup_remote_token() {
            if [ -n "$REMOTE_TOKEN_FILE" ]; then
              ssh $SSH_OPTS "$BOX_SSH_USER@$BOX_SSH_HOST" \
                "rm -f -- '$REMOTE_TOKEN_FILE'" || true
            fi
          }
          trap cleanup_remote_token EXIT
          if [ -n "$PLATFORM_BASE_DOMAIN" ] || [ -n "$PLATFORM_CLOUDFLARE_TOKEN" ]; then
            if [ -z "$PLATFORM_BASE_DOMAIN" ] || [ -z "$PLATFORM_CLOUDFLARE_TOKEN" ]; then
              echo "PLATFORM_BASE_DOMAIN and PLATFORM_DNS_CLOUDFLARE_API_TOKEN must be configured together" >&2
              exit 1
            fi
            PLATFORM_CONFIGURED=true
            CREATED_TOKEN_FILE=$(ssh $SSH_OPTS "$BOX_SSH_USER@$BOX_SSH_HOST" \
              'umask 077; mktemp /tmp/stackdome-platform-cloudflare-token.XXXXXX')
            if [[ ! "$CREATED_TOKEN_FILE" =~ ^/tmp/stackdome-platform-cloudflare-token\.[A-Za-z0-9]+$ ]]; then
              echo "failed to create a safe remote token file" >&2
              exit 1
            fi
            REMOTE_TOKEN_FILE=$CREATED_TOKEN_FILE
            printf '%s' "$PLATFORM_CLOUDFLARE_TOKEN" | \
              ssh $SSH_OPTS "$BOX_SSH_USER@$BOX_SSH_HOST" "cat > '$REMOTE_TOKEN_FILE'"
          fi

          IMAGE_B64=$(printf '%s' "$IMAGE" | base64 -w0)
          BASE_DOMAIN_B64=$(printf '%s' "$PLATFORM_BASE_DOMAIN" | base64 -w0)
          ACME_ENVIRONMENT_B64=$(printf '%s' "$PLATFORM_ACME_ENVIRONMENT" | base64 -w0)
          TOKEN_FILE_B64=$(printf '%s' "$REMOTE_TOKEN_FILE" | base64 -w0)
          ssh $SSH_OPTS "$BOX_SSH_USER@$BOX_SSH_HOST" bash -s -- \
            "$IMAGE_B64" "$PLATFORM_CONFIGURED" "$BASE_DOMAIN_B64" "$ACME_ENVIRONMENT_B64" \
            "$TOKEN_FILE_B64" <<'EOF'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          IMAGE=$(printf '%s' "$1" | base64 -d)
          PLATFORM_CONFIGURED=$2
          PLATFORM_BASE_DOMAIN=$(printf '%s' "$3" | base64 -d)
          PLATFORM_ACME_ENVIRONMENT=$(printf '%s' "$4" | base64 -d)
          PLATFORM_TOKEN_FILE=$(printf '%s' "$5" | base64 -d)

          chmod +x /usr/local/bin/stackdome-install /usr/local/bin/wait-for-stackresource.sh
          INSTALLER_ARGS=(upgrade --image "$IMAGE")
          if [ "$PLATFORM_CONFIGURED" = true ]; then
            trap 'rm -f -- "$PLATFORM_TOKEN_FILE"' EXIT
            INSTALLER_ARGS+=(
              --platform-base-domain "$PLATFORM_BASE_DOMAIN"
              --platform-cloudflare-token-file "$PLATFORM_TOKEN_FILE"
              --platform-acme-environment "$PLATFORM_ACME_ENVIRONMENT"
            )
          fi
          stackdome-install "${INSTALLER_ARGS[@]}"
          GEN=$(kubectl get stackresource api-server -n stackdome-control-plane -o jsonpath='{.metadata.generation}')
          wait-for-stackresource.sh api-server stackdome-control-plane "$GEN" 600
          EOF
        env:
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
          BOX_SSH_USER: ${{ vars.BOX_SSH_USER || 'root' }}
          BUILT_IMAGE: ${{ needs.build.outputs.image }}
          INPUT_TAG: ${{ inputs.image_tag }}
          IMAGE_REPO: ${{ vars.IMAGE_REPO || 'quay.io/stackdome/stackdome' }}
          PLATFORM_BASE_DOMAIN: ${{ vars.PLATFORM_BASE_DOMAIN }}
          PLATFORM_ACME_ENVIRONMENT: ${{ vars.PLATFORM_ACME_ENVIRONMENT || 'staging' }}
          PLATFORM_CLOUDFLARE_TOKEN: ${{ secrets.PLATFORM_DNS_CLOUDFLARE_API_TOKEN }}
