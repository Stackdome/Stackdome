name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure private module access
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download
        env:
          GOPRIVATE: github.com/ashishmax31/*,stackdome.io/*,github.com/Stackdome/*

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          # Stale analysis cache corrupts staticcheck's noreturn facts,
          # producing false SA5011 on `if x == nil { t.Fatal }` patterns.
          skip-cache: true

  # The Go client and the frontend types are generated from the OpenAPI spec.
  # Regenerate them here and fail if the checked-in copies differ.
  generated-clients:
    name: generated clients match the spec
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Regenerate the Go client
        run: make generate

      - name: Regenerate the frontend types
        run: |
          pnpm --prefix frontend install --frozen-lockfile
          pnpm --prefix frontend generate:openapi-types
          pnpm --prefix frontend generate:openapi-zod

      - name: Fail if anything changed
        run: |
          git diff --exit-code -- \
            pkg/api/openapi \
            frontend/src/api/types/openapi.d.ts \
            frontend/src/api/zod-schemas.ts \
          || (echo "Generated clients are stale. Run 'make generate' and the frontend generate:openapi-* scripts." && exit 1)
