openapi: 3.0.0
info:
  title: stackdome-api-server
  version: 0.0.1
  description: stackdome-api-server
paths:
  /api/v1/users:
    post:
      summary: Create new user
      description: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}:
    get:
      security:
        - Bearer: []
      summary: Get a user
      description: Get a user
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/me:
    get:
      security:
        - Bearer: []
      summary: Get a the current authenticated user
      description: Get a the current authenticated user
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      summary: User login
      description: Authenticate user and generate an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/workspace-provision-requests:
    post:
      summary: Create a new workpace provision request object
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceProvisionRequest'
      responses:
        '201':
          description: WorkspaceProvisionRequest added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /api/v1/workspace-provision-requests/current:
    get:
      summary: Get the current users workspace provision request object.
      security:
        - Bearer: []
      responses:
        '200':
          description: WorkspaceProvisionRequest details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
        '401':
          description: Unauthorized
        '404':
          description: WorkspaceProvisionRequest object not found
        '500':
          description: Internal server error
  /api/v1/workspace-provision-requests/{id}:
    get:
      summary: Get a workspace provision request object by ID
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: WorkspaceProvisionRequest details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
        '401':
          description: Unauthorized
        '404':
          description: WorkspaceProvisionRequest object not found
        '500':
          description: Internal server error
    put:
      summary: Update a WorkspaceProvisionRequest
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceProvisionRequest'
      responses:
        '200':
          description: WorkspaceProvisionRequest updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceProvisionRequest'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '404':
          description: WorkspaceProvisionRequest not found
        '500':
          description: Internal server error

    delete:
      summary: Delete a WorkspaceProvisionRequest
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: WorkspaceProvisionRequest deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: WorkspaceProvisionRequest not found
        '500':
          description: Internal server error
  /api/v1/organizations/{id}/workspace-storages:
    post:
      summary: Create a new WorkspaceStorage object
      security:
      - Bearer: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceStorage'
      responses:
        '201':
          description: WorkspaceStorage created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorage'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    get:
      summary: List all WorkspaceStorage objects for an organization
      security:
        - Bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: workspaceName
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
            enum: [Pending, Creating, Created, Failed]
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceStorage'
                  total:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /api/v1/organizations/{org_id}/workspace-storages/{id}:
    get:
      summary: Get a specific WorkspaceStorage object
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorage'
        '404':
          description: WorkspaceStorage not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    put:
      summary: Update a WorkspaceStorage object
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceStorage'
      responses:
        '200':
          description: WorkspaceStorage updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorage'
        '400':
          description: Invalid request payload
        '404':
          description: WorkspaceStorage not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    
    delete:
      summary: Delete a WorkspaceStorage object
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: WorkspaceStorage deleted successfully
        '404':
          description: WorkspaceStorage not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error


components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: User's ID
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        organisation:
          type: string
          description: User's organisation
        role:
          type: string
          description: User's role
        organisation_id:
          type: string
          description: OrganisationID
    UserCreateRequest:
      type: object
      required:
      - name
      - email
      - password
      - organisation_id
      properties:
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: Users desired password
        organisation:
          type: string
          description: User's organisation
        organisation_id:
          type: string
          description: OrganisationID
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email
        password:
          type: string
          format: password
          description: User's password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Access token for authenticated requests
        expires_in:
          type: integer
          description: Token expiration time in seconds
    WorkspaceProvisionRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        org_id:
          type: string
        ssh_public_key:
          type: string
        status:
          $ref: '#/components/schemas/WorkspaceProvisionRequestStatus'
        state:
          $ref: '#/components/schemas/WorkspaceProvisionRequestState'
        message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - ssh_public_key
    WorkspaceProvisionRequestState:
      type: string
      enum:
      - Completed
      - Error
      - Pending
    WorkspaceProvisionRequestStatus:
      type: object
      properties:
        workspace_namespace:
          type: string
          nullable: true
        workspace_service_accountname:
          type: string
          nullable: true
        workspace_serviceaccount_token:
          type: string
          nullable: true
        cluster_ca_cert:
          type: string
          nullable: true
        cluster_url:
          type: string
          nullable: true
        domain:
          type: string
          nullable: true
    Cluster:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        organisation_id:
          type: string
        default:
          type: boolean
        cluster_url:
          type: string
        cluster_ca_data:
          type: string
        client_cert_data:
          type: string
        client_key_data:
          type: string
    WorkspaceStorage:
      type: object
      additionalProperties: false
      required:
        - name
        - namespace
        - ssh_config
        - volumes
      properties:
        id:
          type: string
          readOnly: true
        organisation_id:
          type: string
          readOnly: true
        name:
          type: string
        namespace:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        ssh_config:
          $ref: '#/components/schemas/SSHConfig'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        status:
          $ref: '#/components/schemas/WorkspaceStorageStatus'
          readOnly: true
        state:
          $ref: '#/components/schemas/WorkspaceStorageState'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    WorkspaceStorageState:
      type: string
      enum:
      - StoragePending
      - StorageCreating
      - StorageCreated
      - StorageReady
      - StorageFailed
    Volume:
      type: object
      additionalProperties: false
      required:
        - name
        - spec
      properties:
        id: 
          type: string
          readOnly: true
        name:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        spec:
          $ref: '#/components/schemas/WorkspaceVolumeSpec'
        status:
          $ref: '#/components/schemas/VolumeStatus'
          readOnly: true

    SSHConfig:
      type: object
      additionalProperties: false
      required:
        - public_key
      properties:
        public_key:
          type: string
          description: The SSH public key in OpenSSH format
    
    WorkspaceVolumeSpec:
          type: object
          required:
            - size
          additionalProperties: false
          properties:
            size:
              type: string
            storage_class:
              type: string
            sync_before_use:
              type: boolean
            source:
              $ref: '#/components/schemas/VolumeSource'
    VolumeSource:
      type: object
      required:
        - source_type
      additionalProperties: false
      properties:
        source_type:
          $ref: '#/components/schemas/VolumeSourceTypes'
        local_source:
          $ref: '#/components/schemas/LocalSource'
        build_source:
          type: array
          items:
            $ref: '#/components/schemas/BuildArtifact'

    VolumeSourceTypes:
      type: string
      enum:
      - Local
      - BuildArtifact

    LocalSource:
      type: object
      required:
        - path
        - sync
      properties:
        path:
          type: string
        sync:
          type: boolean

    BuildArtifact:
      type: object
      required:
        - resource_ref
        - source_path
        - destination_path
      properties:
        resource_ref:
          type: string
        source_path:
          type: string
        destination_path:
          type: string

    WorkspaceStorageStatus:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        phase:
          type: string
        storage_server_service_name:
          type: string

    VolumeStatus:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        phase:
          type: string
        build_artifact_syncs:
          type: array
          items:
            $ref: '#/components/schemas/BuildArtifactSyncInfo'

    BuildArtifactSyncInfo:
      type: object
      properties:
        resource_name:
          type: string
        build_id:
          type: string
        status:
          type: string

    Condition:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        status:
          type: string
        observed_generation:
          type: integer
        last_transition_time:
          type: string
          format: date-time
        reason:
          type: string
        message:
          type: string
    Label:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    
    Annotation:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    Error:
      allOf:
        - $ref: '#/components/schemas/ObjectReference'
        - type: object
          properties:
            code:
              type: string
            reason:
              type: string
            operation_id:
              type: string
    ErrorList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      allOf:
        - $ref: '#/components/schemas/List'
    List:
      type: object
      properties:
        kind:
          type: string
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
      required:
        - kind
        - page
        - size
        - total
        - items
    ObjectReference:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        href:
          type: string