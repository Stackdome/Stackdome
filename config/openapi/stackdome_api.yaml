    SecretReference:
      type: object
      required:
        - secret_id
        - key
      properties:
        secret_id:
          type: string
          format: uuid
          description: UUID of the Stackdome secret
        key:
          type: string
          description: Key within the secret containing the value

    WALConfiguration:
      type: object
      properties:
        compression:
          type: string
          enum:
            - gzip
            - lz4
            - zstd
          default: gzip
          description: Compression type for WAL files

    ObjectStoreStatus:
      type: object
      properties:
        state:
          type: string
          enum:
            - Pending
            - Ready
            - Error
        message:
          type: string

    PostgresAddon:
      type: object
      required:
        - name
        - spec
      properties:
        id:
          type: string
          readOnly: true
        organisation_id:
          type: string
          readOnly: true
        team_id:
          type: string
          readOnly: true
        user_id:
          type: string
          readOnly: true
        cluster_id:
          type: string
          readOnly: true
        name:
          type: string
          description: Unique name for this PostgreSQL cluster
        namespace:
          type: string
          readOnly: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        revision:
          type: string
          readOnly: true
        outputs:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/OutputDescriptor'
        spec:
          $ref: '#/components/schemas/PostgresAddonSpec'
        status:
          $ref: '#/components/schemas/PostgresAddonStatus'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    PostgresAddonList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostgresAddon'
        total:
          type: integer

    PostgresAddonSpec:
      type: object
      required:
        - version
        - instances
        - storage
      properties:
        version:
          $ref: '#/components/schemas/PostgresVersion'
        instances:
          $ref: '#/components/schemas/PostgresInstances'
        storage:
          $ref: '#/components/schemas/PostgresStorage'
        resources:
          $ref: '#/components/schemas/PostgresResources'
        backup:
          $ref: '#/components/schemas/PostgresBackupConfig'
        initialization:
          $ref: '#/components/schemas/PostgresInitialization'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/PostgresDatabase'
        configuration:
          $ref: '#/components/schemas/PostgresConfiguration'

    PostgresVersion:
      type: object
      required:
        - major
      properties:
        major:
          type: integer
          minimum: 13
          maximum: 17
          description: PostgreSQL major version
        minor:
          type: integer
          description: PostgreSQL minor version
        enable_auto_minor_upgrade:
          type: boolean
          default: true
          description: Enable automatic minor version upgrades
        enable_auto_major_upgrade:
          type: boolean
          default: false
          description: Enable automatic major version upgrades

    PostgresInstances:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 5
          description: Number of PostgreSQL instances
        placement:
          type: object
          properties:
            topology_key:
              type: string
              default: kubernetes.io/hostname
              description: Topology key for instance spreading
            policy:
              type: string
              enum:
                - preferred
                - required
              default: preferred
              description: Instance placement policy
            node_selector:
              type: object
              additionalProperties:
                type: string
              description: Node selector for instance placement
            tolerations:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  operator:
                    type: string
                  value:
                    type: string
                  effect:
                    type: string
    PostgresStorage:
      type: object
      required:
        - size
        - storage_class
      properties:
        size:
          type: string
          pattern: '^[0-9]+[KMGTP]i?$'
          description: Storage size (e.g., 10Gi, 100Gi)
        storage_class:
          type: string
          description: Kubernetes storage class name

    PostgresResources:
      type: object
      properties:
        cpu:
          type: object
          properties:
            request:
              type: string
              description: CPU request (e.g., 100m, 1)
            limit:
              type: string
              description: CPU limit
        memory:
          type: object
          properties:
            request:
              type: string
              description: Memory request (e.g., 256Mi, 1Gi)
            limit:
              type: string
              description: Memory limit

    PostgresBackupConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Enable backup functionality
        object_store_id:
          type: string
          description: Reference to ObjectStore for backup storage
        schedule:
          type: string
          default: "0 0 0 * * 0"
          description: Cron schedule for automated backups
        wal_archiving:
          type: boolean
          default: false
          description: Enable WAL archiving for point-in-time recovery

    PostgresInitialization:
      type: object
      properties:
        type:
          type: string
          enum:
            - new
            - restore_from_backup
            - restore_from_object_store
            - import_from_external
          default: new
        restore_from_backup:
          type: object
          properties:
            backup_id:
              type: string
              description: ID of backup to restore from
        restore_from_object_store:
          type: object
          properties:
            object_store_id:
              type: string
              description: Object store containing the backup
            source_postgres_addon_id:
              type: string
              description: Source PostgresAddon that created the backup
            recovery_target_time:
              type: string
              format: date-time
              description: Point-in-time recovery target
        import_from_external:
          type: object
          required:
            - host
            - port
            - database
            - username
            - password_secret_id
          properties:
            host:
              type: string
            port:
              type: integer
              default: 5432
            database:
              type: string
            username:
              type: string
            password_secret_id:
              type: string
              description: Secret containing the password
            ssl_mode:
              type: string
              enum:
                - disable
                - require
                - verify-ca
                - verify-full
              default: require
            databases_to_import:
              type: array
              items:
                type: string
              description: Specific databases to import

    PostgresDatabase:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Database name
        extensions:
          type: array
          items:
            type: string
            enum:
              - vector
          description: PostgreSQL extensions to enable

    PostgresConfiguration:
      type: object
      properties:
        enable_superuser_access:
          type: boolean
          default: false
          description: Enable superuser access to the database
        parameters:
          type: object
          additionalProperties:
            type: string
          description: PostgreSQL configuration parameters
          example:
            max_connections: "200"
            shared_buffers: "256MB"
            work_mem: "4MB"

    PostgresAddonStatus:
      type: object
      properties:
        state:
          type: string
          enum:
            - Pending
            - Creating
            - Initializing
            - Ready
            - Updating
            - Backing Up
            - Restoring
            - Error
            - Deleting
            - Hibernated
            - Fenced
        message:
          type: string
        phase:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        observed_revision:
          type: string
        observed_generation:
          type: integer
        cluster_info:
          $ref: '#/components/schemas/PostgresClusterInfo'
        connection_info:
          $ref: '#/components/schemas/PostgresConnectionInfo'

    PostgresClusterInfo:
      type: object
      properties:
        version:
          type: string
          description: Current PostgreSQL version

    PostgresConnectionInfo:
      type: object
      properties:
        host:
          type: string
          description: Primary host endpoint
        port:
          type: integer
          default: 5432
        databases:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              owner:
                type: string
        credentials:
          type: object
          properties:
            superuser_secret_id:
              type: string
              description: Secret containing superuser credentials
            app_user_secrets:
              type: object
              additionalProperties:
                type: string
              description: Map of database to app user secret IDs
            ca_certificate_secret_id:
              type: string
              description: Secret containing CA certificate

    PostgresBackup:
      type: object
      properties:
        id:
          type: string
          description: Unique backup identifier
        postgres_addon_id:
          type: string
          description: ID of the PostgreSQL addon this backup belongs to
        name:
          type: string
          description: Human-readable backup name
        description:
          type: string
          description: Optional backup description
        type:
          type: string
          enum:
            - scheduled
            - manual
            - pre_upgrade
          description: How the backup was initiated
        phase:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
          description: Current backup status
        started_at:
          type: string
          format: date-time
          description: When the backup started
        completed_at:
          type: string
          format: date-time
          description: When the backup completed (if finished)
        error:
          type: string
          description: Error message if backup failed
        size_bytes:
          type: integer
          description: Backup size in bytes (if available)
        created_at:
          type: string
          format: date-time
          description: When the backup record was created

    PostgresBackupList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostgresBackup'
        total:
          type: integer
