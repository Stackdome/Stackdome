components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    org_id:
      name: org_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the organization
    cluster_id:
      name: org_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the cluster
    stack_id:
      name: stack_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the stack
  schemas:
    Organisation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainName'
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DomainName:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        fqdn:
          type: string
          description: Fully Qualified Domain Name
    UserSignupResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        jwt_token:
          type: string
          description: JWT token for the authenticated user
    User:
      type: object
      properties:
        id:
          type: string
          description: User's ID
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        organisation:
          type: string
          description: User's organisation
        role:
          $ref: '#/components/schemas/UserRole'
        organisation_id:
          type: string
          description: OrganisationID
    UserSignupRequest:
      type: object
      required:
      - name
      - email
      - password
      properties:
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: Users desired password
        Role:
          $ref: '#/components/schemas/UserRole'
        organisation:
          $ref: '#/components/schemas/Organisation'
        organisation_id:
          type: string
          description: OrganisationID
    UserRole:
      type: string
      enum:
      - OrganisationAdmin
      - PlatformAdmin
      - User
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email
        password:
          type: string
          format: password
          description: User's password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Access token for authenticated requests
        user:
          $ref: '#/components/schemas/User'
        expires_in:
          type: integer
          description: Token expiration time in seconds
    WorkspaceUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        org_id:
          type: string
        workspaces:
          type: array
          minItems: 1
          items:
            type: string
        version:
          readOnly: true
          type: integer
        status:
          $ref: '#/components/schemas/WorkspaceUserStatus'
        state:
          $ref: '#/components/schemas/WorkspaceUserState'
        message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - workspaces
    WorkspaceUserState:
      type: string
      enum:
      - Completed
      - Error
      - Pending
    WorkspaceUserStatus:
      type: object
      properties:
        observed_version:
          type: integer
        provisioned_namespaces:
          type: array
          items:
            type: object
            properties:
              workspace_name:
                type: string
              namespace:
                type: string
        service_account_name:
          type: string
          nullable: true
        serviceaccount_token:
          type: string
          nullable: true
        cluster_ca_cert:
          type: string
          nullable: true
        cluster_url:
          type: string
          nullable: true
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
    ClusterList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
        total:
          type: integer
    Cluster:
      type: object
      required:
        - name
        - cluster_url
        - cluster_ca_data
        - cluster_sa_token
      properties:
        id:
          type: string
        name:
          type: string
        organisation_id:
          type: string
        default:
          type: boolean
        cluster_url:
          type: string
        cluster_ca_data:
          type: string
        cluster_sa_token:
          type: string
        cluster_image_registry:
          $ref: '#/components/schemas/ClusterImageRegistry'
    
    RemoteSyncServer:
      type: object
      additionalProperties: false
      required:
        - name
        - spec
      properties:
        id:
          type: string
          readOnly: true
        organisation_id:
          type: string
          readOnly: true
        name:
          type: string
        namespace:
          readOnly: true
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        spec:
          $ref: '#/components/schemas/RemoteSyncServerSpec'
        status:
          $ref: '#/components/schemas/RemoteSyncServerStatus'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    RemoteSyncServerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RemoteSyncServer'
        total:
          type: integer

    RemoteSyncServerSpec:
      type: object
      required:
        - volumes
      additionalProperties: false
      properties:
        volumeName:
          type: string
        ssh_public_key:
          type: string

    RemoteSyncServerState:
      type: string
      enum:
      - RemoteSyncServerPending
      - RemoteSyncServerCreating
      - RemoteSyncServerCreated
      - RemoteSyncServerReady
      - RemoteSyncServerFailed

    Volume:
      type: object
      additionalProperties: false
      required:
        - name
        - spec
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        spec:
          $ref: '#/components/schemas/VolumeSpec'
        status:
          $ref: '#/components/schemas/VolumeStatus'
          readOnly: true

    VolumeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        total:
          type: integer

    SSHConfig:
      type: object
      additionalProperties: false
      required:
        - public_key
      properties:
        public_key:
          type: string
          description: The SSH public key in OpenSSH format

    VolumeSpec:
          type: object
          required:
            - size
            - needs_sync_before_use
            - access_mode
          additionalProperties: false
          properties:
            size:
              type: string
            storage_class:
              type: string
            needs_sync_before_use:
              type: boolean
            access_mode:
              $ref: '#/components/schemas/VolumeAccessMode'
            source:
              $ref: '#/components/schemas/VolumeSource'
    VolumeAccessMode:
      type: string
      enum:
        - ReadWriteOnce
        - ReadWriteMany
        - ReadOnlyMany
    
    VolumeSource:
      type: object
      required:
        - source_type
      additionalProperties: false
      properties:
        git_repo_source:
          $ref: '#/components/schemas/GitRepoSource'
        source_type:
          $ref: '#/components/schemas/VolumeSourceTypes'
        remote_source:
          $ref: '#/components/schemas/RemoteSource'
        build_source:
          type: array
          items:
            $ref: '#/components/schemas/BuildArtifact'

    VolumeSourceTypes:
      type: string
      enum:
      - RemoteDir
      - BuildArtifact
      - GitRepo

    GitRepoSource:
      type: object
      required:
        - repo_url
        - revision
      properties:
        repo_url:
          type: string
        revision:
          $ref: '#/components/schemas/GitRepoRevision'

    GitRepoRevision:
      type: object
      properties:
        branch:
          type: object
          properties:
            name:
              type: string
            head_sha:
              type: string
        commit:
          type: string
        tag:
          type: string

    RemoteSource:
      type: object
      required:
        - path
        - current_directory_hash
      properties:
        path:
          type: string
        current_directory_hash:
          type: string

    BuildArtifact:
      type: object
      required:
        - resource_ref
        - source_path
        - destination_path
      properties:
        resource_ref:
          type: string
        source_path:
          type: string
        destination_path:
          type: string

    RemoteSyncServerStatus:
      type: object
      properties:
        observed_version:
          type: integer
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        state:
          $ref: '#/components/schemas/RemoteSyncServerState'
        serviceName:
          type: string

    VolumeStatus:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        phase:
          type: string
        build_artifact_syncs:
          type: array
          items:
            $ref: '#/components/schemas/BuildArtifactSyncInfo'
        last_synced_git_revision:
          type: string
        last_remote_sync_hash:
          type: string

    BuildArtifactSyncInfo:
      type: object
      properties:
        resource_name:
          type: string
        build_id:
          type: string
        status:
          type: string

    Stack:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        organisation_id:
          type: string
          readOnly: true
        user_id:
          type: string
          readOnly: true
        name:
          type: string
        namespace:
          type: string
          readOnly: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        version:
          type: integer
          readOnly: true
        spec:
          $ref: '#/components/schemas/StackSpec'
        status:
          $ref: '#/components/schemas/StackStatus'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - spec
    
    StackList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Stack'
        total:
          type: integer

    StackSpec:
      type: object
      required:
        - stack_resources
      properties:
        stack_resources:
          type: array
          items:
            $ref: '#/components/schemas/StackResource'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/Volume'

    StackStatus:
      type: object
      properties:
        state:
          type: string
        observed_version:
          type: integer
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'

    StackResource:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        stack_id:
          type: string
          readOnly: true
        name:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        version:
          type: integer
          readOnly: true
        build_spec:
          $ref: '#/components/schemas/StackResourceBuildSpec'
        image_spec:
          $ref: '#/components/schemas/ImageSpec'
        init_spec:
          $ref: '#/components/schemas/InitSpec'
        execution_config:
          $ref: '#/components/schemas/ExecutionConfig'
        volume_mounts:
          type: array
          items:
            $ref: '#/components/schemas/VolumeMount'
        depends_on:
          type: array
          items:
            type: string
        lifecycle_config:
          $ref: '#/components/schemas/LifecycleConfig'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/Port'
        stateful:
          type: boolean
        status:
          $ref: '#/components/schemas/StackResourceStatus'
          readOnly: true
      required:
        - name

    StackResourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StackResource'
        total:
          type: integer

    ImageBuild:
      type: object
      required:
        - stack_resource_name
        - stack_resource_id
        - source_revision
        - image_repo
        - build_context
      properties:
        id:
          type: string
        namespace:
          type: string
        stack_id:
          type: string
        stack_resource_id:
          type: string
        stack_resource_name:
          type: string
        source_revision:
          $ref: '#/components/schemas/BuildSourceRevision'
        build_context:
          $ref: '#/components/schemas/BuildSourceContext'
        image_repo:
          type: string
        status:
          $ref: '#/components/schemas/ImageBuildStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ImageBuildList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageBuild'
        total:
          type: integer

    ImageBuildStatus:
      type: object
      properties:
        state:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        image_url:
          type: string
        build_source_revision:
          type: string
    ClusterImageRegistryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClusterImageRegistry'
        total:
          type: integer
    ClusterImageRegistry:
      type: object
      required:
        - name
      properties:
        id:
          type: string
        name:
          type: string
        organisation_id:
          type: string
          readOnly: true
        cluster_id:
          type: string
          readOnly: true
        spec:
          $ref: '#/components/schemas/ClusterImageRegistrySpec'
        status:
          $ref: '#/components/schemas/ClusterImageRegistryStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClusterImageRegistrySpec:
      type: object
      properties:
        backend_storage_size:
          type: string
        backend_storage_class:
          type: string
        max_repositories:
          type: integer
        tags_per_repository:
          type: integer
        delete_untagged:
          type: boolean
    ClusterImageRegistryStatus:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/ClusterImageRegistryState'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
    ClusterImageRegistryState:
      type: string
      enum:
      - ImageRegistryPending
      - ImageRegistryError
      - ImageRegistryRunning
    StackResourceStatus:
      type: object
      properties:
        public_ingress:
          type: array
          items:
            $ref: '#/components/schemas/Ingress'
        internal_service_name:
          type: string
        last_restart_request_processed_at:
          type: string
          format: date-time
        state:
          type: string
        observed_version:
          type: integer
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
    Ingress:
      type: object
      properties:
        url:
          type: string
        target_port:
          type: integer
    VolumeMount:
      type: object
      required:
        - source_volume_name
        - target_path
      properties:
        stack_resource_id:
          type: string
          readOnly: true
        source_volume_type:
          $ref: '#/components/schemas/VolumeMountSourceType'
          readOnly: true
        source_volume_name:
          type: string
        source_sub_path:
          type: string
        target_path:
          type: string

    VolumeMountSourceType:
      type: string
      enum:
      - EmptyVolume
      - RemoteDirSyncedVolume
      - BuildArtifactSyncedVolume
      - GitRepoSyncedVolume
    Port:
      type: object
      required:
        - number
        - exposed_to_public
      properties:
        number:
          type: integer
        protocol:
          type: string
        exposed_to_public:
          type: boolean
        subdomain_prefix:
          type: string

    LifecycleConfig:
      type: object
      properties:
        restart_request_time:
          type: string
          format: date-time

    StackResourceBuildSpec:
      type: object
      additionalProperties: false
      required:
        - source_context
        - context_path_within_source
        - dockerfile_path
        - source_revision
        - image_repository
      properties:
        source_context:
          $ref: '#/components/schemas/BuildSourceContext'
        context_path_within_source:
          type: string
        dockerfile_path:
          type: string
        source_revision:
          $ref: '#/components/schemas/BuildSourceRevision'
        image_repository:
          $ref: '#/components/schemas/ImageRepository'
          description: The image repository to push the built image to
    ImageRepository:
      type: object
      description: The image repository to push the built image to
      additionalProperties: false
      properties:
        external_image_repo_url:
          type: string
        use_internal_registry:
          type: boolean
    BuildSourceContext:
      type: object
      properties:
        volume:
          type: object
          required:
            - id
          properties:
            id:
              type: string
            name:
              type: string
        git_repo:
          type: object
          required:
            - repo_url
          properties:
            repo_url:
              type: string

    BuildSourceRevision:
      type: object
      properties:
        volume_source_revision:
          type: object
          required:
            - current_volume_hash
          properties:
            current_volume_hash:
              type: string
        git_repo_revision:
          $ref: '#/components/schemas/GitRepoRevision'

    ImageSpec:
      type: object
      additionalProperties: false
      required:
        - image
      properties:
        image:
          type: string

    InitSpec:
      type: object
      additionalProperties: false
      properties:
        image_spec:
          $ref: '#/components/schemas/ImageSpec'
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string

    ExecutionConfig:
      type: object
      properties:
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        environment_variables:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'

    EnvVar:
      type: object
      additionalProperties: false
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string


    Condition:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        status:
          type: string
        observed_generation:
          type: integer
        last_transition_time:
          type: string
          format: date-time
        reason:
          type: string
        message:
          type: string
    Label:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string

    Annotation:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    Error:
      allOf:
        - $ref: '#/components/schemas/ObjectReference'
        - type: object
          properties:
            code:
              type: string
            reason:
              type: string
            operation_id:
              type: string
    ErrorList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      allOf:
        - $ref: '#/components/schemas/List'
    List:
      type: object
      properties:
        kind:
          type: string
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
      required:
        - kind
        - page
        - size
        - total
        - items
    ObjectReference:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        href:
          type: string