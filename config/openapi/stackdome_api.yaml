components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    org_id:
      name: org_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the organization
    cluster_id:
      name: cluster_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the cluster
    team_name:
      name: team_name
      in: path
      required: true
      schema:
        type: string
      description: The name of the team
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the user
    resource_name:
      name: resource_name
      in: path
      required: true
      schema:
        type: string
      description: The name of the stack resource
    connection_id:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the stack connection
    build_id:
      name: build_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the build
    database:
      name: database
      in: path
      required: true
      schema:
        type: string
      description: The name of the database
  schemas:
    AppConfigResponse:
      type: object
      properties:
        github_oauth:
          type: boolean
          description: True when GitHub OAuth login is configured on the server.
    Organisation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainName'
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DomainName:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        fqdn:
          type: string
          description: Fully Qualified Domain Name
    UserSignupResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        jwt_token:
          type: string
          description: JWT token for the authenticated user
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
    User:
      type: object
      properties:
        id:
          type: string
          description: User's ID
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        organisation:
          type: string
          description: User's organisation
        role:
          $ref: '#/components/schemas/UserRole'
        organisation_id:
          type: string
          description: OrganisationID
        teams:
          type: array
          items:
            $ref: '#/components/schemas/UserTeamMembership'
          description: Teams the user belongs to (included in login/signup/current-user responses)
    UserTeamMembership:
      type: object
      properties:
        team_id:
          type: string
        team_name:
          type: string
        role:
          type: string
          enum:
            - Developer
            - Viewer
        default_team:
          type: boolean
    UserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          description: Total number of records
        page:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Number of items per page
        total_pages:
          type: integer
          description: Total number of pages
    UserSignupRequest:
      type: object
      required:
      - name
      - email
      - password
      properties:
        name:
          type: string
          description: User's name
        email:
          type: string
          format: email
