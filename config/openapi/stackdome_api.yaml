openapi: 3.0.0
info:
  title: stackdome-api-server
  version: 0.0.1
  description: stackdome-api-server
paths:
  /api/v1/user-signup:
    post:
      summary: Create new user
      description: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSignupResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/config:
    get:
      summary: Get public application configuration
      description: Returns feature flags the web client needs before authentication, such as whether GitHub OAuth is enabled.
      responses:
        '200':
          description: Application configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}:
    get:
      security:
        - Bearer: []
      summary: Get a user
      description: Get a user
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/current:
    get:
      security:
        - Bearer: []
      summary: Get the current authenticated user
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/current/teams:
    get:
      security:
        - Bearer: []
      summary: List teams for the current authenticated user
      responses:
        '200':
          description: Teams listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      summary: User login
      description: Authenticate user and generate an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      summary: Refresh JWT token
      description: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/github:
    get:
      summary: Initiate GitHub OAuth flow
      description: Redirects the user to GitHub for OAuth authorization
      responses:
        '302':
          description: Redirect to GitHub OAuth authorization page
        '500':
          description: Internal server error
  /api/v1/auth/github/callback:
    get:
      summary: GitHub OAuth callback
      description: Handles the callback from GitHub after OAuth authorization
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: OAuth authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/api-tokens:
    post:
      security:
        - Bearer: []
      summary: Create a new API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenCreateRequest'
      responses:
        '201':
          description: API token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenCreateResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      security:
        - Bearer: []
      summary: List all API tokens for the current user
      responses:
        '200':
          description: API tokens listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenList'
  /api/v1/api-tokens/scopes:
    get:
      security:
        - Bearer: []
      summary: List all available API token scopes
      description: Returns the list of resources and their allowed actions that can be used when creating API tokens
      responses:
        '200':
          description: Scopes listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeList'
        '401':
          description: Unauthorized
  /api/v1/api-tokens/{id}:
    get:
      security:
        - Bearer: []
      summary: Get an API token by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: API token fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '404':
          description: API token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      security:
        - Bearer: []
      summary: Revoke an API token
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: API token revoked successfully
        '404':
          description: API token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{id}:
    get:
      security:
        - Bearer: []
      summary: Get an organization
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Organization fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      security:
        - Bearer: []
      summary: Update an organization
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organisation'
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User listing (org-scoped)
  /api/v1/organizations/{org_id}/users:
    get:
      summary: List all users in an organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
          description: Number of items per page
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Org-scoped secret listing (cross-team)
  /api/v1/organizations/{org_id}/secrets:
    get:
      summary: List all secrets the user has access to across all teams
      description: Returns secrets from all teams the user belongs to. OrgAdmins see all secrets in the org.
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - in: query
          name: name
          schema:
            type: string
          description: Filter by secret name
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Org-scoped registry credentials (auto-attached by registry host)
  /api/v1/organizations/{org_id}/registry-credentials:
    post:
      summary: Create a registry credential for the organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredential'
      responses:
        '201':
          description: Registry credential created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredential'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: A credential for this host and purpose already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
    get:
      summary: List registry credentials for the organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/registry-credentials/{id}:
    get:
      summary: Get a registry credential
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredential'
        '404':
          description: Registry credential not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    put:
      summary: Update a registry credential (username/password rotation)
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredential'
      responses:
        '200':
          description: Registry credential updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredential'
        '400':
          description: Invalid request payload
        '404':
          description: Registry credential not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    delete:
      summary: Delete a registry credential
      description: >-
        Deletion is never blocked; the response lists stacks that were
        implicitly resolving against this credential so rotations are visible.
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Registry credential deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialDeleteResponse'
        '404':
          description: Registry credential not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/registry-credentials/{id}/verify:
    post:
      summary: Verify a registry credential against a repository
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredentialVerifyRequest'
      responses:
        '204':
          description: Credential verified successfully
        '400':
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Registry credential not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  # Org-scoped git integrations (auto-attached by git host)
  /api/v1/organizations/{org_id}/git-integrations/github/manifest:
    post:
      summary: Start the GitHub App manifest flow for the organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '201':
          description: Manifest flow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppManifestFlow'
        '400':
          description: The hub external URL is not configured
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: A GitHub App is already installed
        '500':
          description: Internal server error
  /api/v1/git-integrations/github/manifest/callback:
    get:
      summary: GitHub App manifest redirect target (unauthenticated, state-validated)
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirects the browser to the GitHub App install page
        '400':
          description: Invalid or expired state
        '500':
          description: Internal server error
  /api/v1/webhooks/github:
    post:
      summary: GitHub webhook receiver (unauthenticated, HMAC-verified)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Delivery accepted
        '403':
          description: Signature verification failed
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/git-integrations/{id}/installations:
    get:
      summary: List GitHub App installations
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
        - in: query
          name: refresh
          schema:
            type: boolean
            default: false
          description: Re-list installations from GitHub before returning (covers missed webhooks)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitInstallationList'
        '404':
          description: Git integration not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/git-integrations/{id}/repositories:
    get:
      summary: List repositories visible to the GitHub App installation
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
        - in: query
          name: query
          schema:
            type: string
          description: Substring filter on the repository full name
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: installation_id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepositoryPage'
        '404':
          description: Git integration not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/git-integrations/{id}/repositories/{owner}/{repo}:
    get:
      summary: Get repository details through the GitHub App installation
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepository'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/git-integrations/{id}/repositories/{owner}/{repo}/branches:
    get:
      summary: List repository branches through the GitHub App installation
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitBranchList'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/git-integrations:
    post:
      summary: Create a git integration for the organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitIntegration'
      responses:
        '201':
          description: Git integration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitIntegration'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: An integration for this host already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
    get:
      summary: List git integrations for the organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitIntegrationList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/git-integrations/{id}:
    get:
      summary: Get a git integration
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitIntegration'
        '404':
          description: Git integration not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    put:
      summary: Update a git integration (credential rotation)
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitIntegration'
      responses:
        '200':
          description: Git integration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitIntegration'
        '400':
          description: Invalid request payload
        '404':
          description: Git integration not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    delete:
      summary: Delete a git integration
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Git integration deleted successfully
        '404':
          description: Git integration not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/git-integrations/{id}/verify:
    post:
      summary: Verify a git integration against a repository
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitIntegrationVerifyRequest'
      responses:
        '204':
          description: Integration verified successfully
        '400':
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Git integration not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  # Org-scoped object store listing (cross-team)
  /api/v1/organizations/{org_id}/object-stores:
    get:
      summary: List all object stores the user has access to across all teams
      description: Returns object stores from all teams the user belongs to. OrgAdmins see all object stores in the org.
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectStoreList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Org-scoped stack listing (cross-team)
  /api/v1/organizations/{org_id}/stacks:
    get:
