              cpu_capacity:
                type: string
                description: CPU capacity in millicores
              memory_capacity:
                type: string
                description: Memory capacity in bytes
              storage_capacity:
                type: string
                description: Storage capacity in bytes
        timestamp:
          type: string
          format: date-time
    ImageBuildList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageBuild'
        total:
          type: integer

    ImageBuildStatus:
      type: object
      properties:
        state:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        image_url:
          type: string
        build_source_revision:
          type: string
        last_build_failure_detail:
          $ref: '#/components/schemas/BuildFailureDetail'
    Secret:
      type: object
      additionalProperties: false
      required:
        - name
        - data
        - type
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        organisation_id:
          type: string
          readOnly: true
        team_id:
          type: string
          readOnly: true
        type:
          $ref: '#/components/schemas/SecretType'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SecretData'
        outputs:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/OutputDescriptor'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SecretList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        total:
          type: integer
    SecretType:
      type: string
      enum:
      - Generic
      - DockerRegistry
      - GitCredentials
      - UsernamePassword
      - Token
      - SSHKey
    SecretData:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: The key for the secret data
        value:
          type: string
          description: The value for the secret data, base64 encoded if necessary
    GitHubAppManifestFlow:
      type: object
