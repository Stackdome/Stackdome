        organisation_id:
          type: string
          readOnly: true
        team_id:
          type: string
          readOnly: true
        name:
          type: string
          description: Unique name for this object store configuration
        spec:
          $ref: '#/components/schemas/ObjectStoreSpec'
        status:
          $ref: '#/components/schemas/ObjectStoreStatus'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ObjectStoreList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObjectStore'
        total:
          type: integer

    ObjectStoreSpec:
      type: object
      required:
        - configuration
        - destination_path
      properties:
        configuration:
          $ref: '#/components/schemas/ObjectStoreConfiguration'
        destination_path:
          type: string
          description: Storage destination URL (e.g., s3://bucket/path, https://account.blob.core.windows.net/container/path)
        retention_policy:
          type: string
          pattern: '^[1-9][0-9]*[dwm]$'
          description: Retention policy (e.g., '1d', '7d', '30d')
          default: '7d'

    ObjectStoreConfiguration:
      type: object
      properties:
        s3_credentials:
          $ref: '#/components/schemas/S3Credentials'
        azure_credentials:
          $ref: '#/components/schemas/AzureCredentials'
        gcs_credentials:
          $ref: '#/components/schemas/GCSCredentials'

    S3Credentials:
      type: object
      required:
        - access_key_id
        - secret_access_key
        - region
      properties:
        access_key_id:
          $ref: '#/components/schemas/SecretReference'
        secret_access_key:
          $ref: '#/components/schemas/SecretReference'
        region:
          type: string
          description: AWS region
        endpoint_url:
          type: string
          description: Custom S3 endpoint URL for S3-compatible storage

    AzureCredentials:
      type: object
      required:
        - connection_string
      properties:
        connection_string:
          $ref: '#/components/schemas/SecretReference'
        storage_account_name:
          type: string
          description: Azure storage account name

    GCSCredentials:
      type: object
      required:
        - service_account_credentials
      properties:
        service_account_credentials:
