          readOnly: true
        team_id:
          type: string
          readOnly: true
        name:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        spec:
          $ref: '#/components/schemas/VolumeSpec'
        status:
          $ref: '#/components/schemas/VolumeStatus'
          readOnly: true

    VolumeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        total:
          type: integer

    SSHConfig:
      type: object
      additionalProperties: false
      required:
        - public_key
      properties:
        public_key:
          type: string
          description: The SSH public key in OpenSSH format

    VolumeSpec:
          type: object
          required:
            - size
            - needs_sync_before_use
            - access_mode
          additionalProperties: false
          properties:
            size:
              type: string
            storage_class:
              type: string
            needs_sync_before_use:
              type: boolean
            access_mode:
              $ref: '#/components/schemas/VolumeAccessMode'
            source:
              $ref: '#/components/schemas/VolumeSource'
    VolumeAccessMode:
      type: string
      enum:
        - ReadWriteOnce
        - ReadWriteMany
        - ReadOnlyMany

    VolumeSource:
      type: object
      required:
        - source_type
      additionalProperties: false
      properties:
        git_repo_source:
          $ref: '#/components/schemas/GitRepoSource'
        source_type:
          $ref: '#/components/schemas/VolumeSourceTypes'
        remote_source:
          $ref: '#/components/schemas/RemoteSource'
        build_source:
          type: array
          items:
            $ref: '#/components/schemas/BuildArtifact'

    VolumeSourceTypes:
      type: string
