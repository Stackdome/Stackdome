          items:
            $ref: '#/components/schemas/BuildArtifactSyncInfo'
        last_synced_git_revision:
          type: string
        last_remote_sync_hash:
          type: string

    BuildArtifactSyncInfo:
      type: object
      properties:
        resource_name:
          type: string
        build_id:
          type: string
        status:
          type: string

    Stack:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        organisation_id:
          type: string
          readOnly: true
        team_id:
          type: string
          readOnly: true
        user_id:
          type: string
          readOnly: true
        name:
          type: string
        namespace:
          type: string
          readOnly: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        revision:
          type: string
          readOnly: true
        spec:
          $ref: '#/components/schemas/StackSpec'
        settings:
          $ref: '#/components/schemas/StackSettings'
        status:
          $ref: '#/components/schemas/StackStatus'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - spec

    StackSettings:
      type: object
      properties:
        release_retention_limit:
          type: integer
          default: 10
          description: Maximum total releases to retain per stack
        min_successful_releases:
          type: integer
          default: 5
          description: Minimum number of successful releases to always keep
        deploy_timeout_minutes:
          type: integer
          default: 15
          description: Minutes to wait for a deploy to converge before marking it failed

    StackList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Stack'
        total:
          type: integer

    StackConnectionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StackConnection'
        total:
          type: integer

    StackSpec:
      type: object
      required:
        - stack_resources
      properties:
        stack_resources:
          type: array
          items:
            $ref: '#/components/schemas/StackResource'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/StackConnection'

    StackStatus:
      type: object
      properties:
        state:
          type: string
        message:
          type: string
        observed_revision:
          type: string
        target_revision:
          type: string
        last_converged:
          $ref: '#/components/schemas/StackConvergenceRecord'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/StackResourceSummary'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'

    StackResource:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        stack_id:
          type: string
          readOnly: true
        name:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        revision:
          type: string
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceSpec'
        init_spec:
          $ref: '#/components/schemas/InitSpec'
        execution_config:
          $ref: '#/components/schemas/ExecutionConfig'
        volume_mounts:
          type: array
          items:
            $ref: '#/components/schemas/VolumeMount'
        depends_on:
          type: array
          items:
            type: string
        lifecycle_config:
          $ref: '#/components/schemas/LifecycleConfig'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/Port'
        outputs:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/OutputDescriptor'
        workload_type:
          type: string
          enum:
            - Service
            - StatefulService
            - Worker
            - Job
            - CronJob
          default: Service
        schedule:
          type: string
        replicas:
          type: integer
          format: int32
          minimum: 0
        status:
          $ref: '#/components/schemas/StackResourceStatus'
          readOnly: true
      required:
        - name

    StackResourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StackResource'
        total:
          type: integer

    OutputDescriptor:
      type: object
      description: Declared output metadata for a topology node. Values are not returned here.
      required:
        - name
        - type
        - sensitive
      properties:
        name:
          type: string
          description: Stable output accessor name, for example `host` or `public.http.url`.
        type:
          type: string
          description: Scalar value type exposed by this output.
          enum:
            - string
            - integer
            - boolean
        sensitive:
          type: boolean
          description: True when the output value is sensitive and should never be returned in normal metadata APIs.

    StackTopology:
      type: object
      required:
        - nodes
        - edges
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'

    TopologyNode:
      type: object
      description: A node in the stack topology graph.
      required:
        - ref
        - label
      properties:
        ref:
          $ref: '#/components/schemas/TopologyNodeRef'
        label:
          type: string
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/OutputDescriptor'
        state:
          type: string
          description: Optional runtime state for nodes that have status, such as stack resources or addons.

    TopologyEdge:
      type: object
      description: An edge in the stack topology graph.
      required:
        - kind
        - source
        - target
        - source_of_truth
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - env
            - volume_mount
            - build_artifact_source
            - depends_on
          description: Edge kind. Explicit connections reuse connection kinds; derived edges use depends_on.
        source:
          description: The producing end of the edge. Corresponds to StackConnection.from.
          $ref: '#/components/schemas/TopologyNodeRef'
        target:
          description: The consuming end of the edge. Corresponds to StackConnection.to.
          $ref: '#/components/schemas/TopologyNodeRef'
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionMapping'
        config:
          $ref: '#/components/schemas/StackConnectionConfig'
        source_of_truth:
          type: string
          enum:
            - connection
            - derived
          description: Whether the edge came from an explicit connection or a derived relationship such as depends_on.

    StackConnection:
      type: object
      description: A user-authored topology edge between two nodes in a stack.
      required:
        - kind
        - from
        - to
      properties:
        id:
          type: string
          description: Stable connection identifier. Generated when omitted.
        kind:
          type: string
          description: >
            The relationship type. `env` injects values into environment variables,
            `volume_mount` mounts a volume into a resource, and
            `build_artifact_source` seeds a volume from build output.
          enum:
            - env
            - volume_mount
            - build_artifact_source
        from:
          $ref: '#/components/schemas/TopologyNodeRef'
        to:
          $ref: '#/components/schemas/TopologyNodeRef'
        mappings:
          type: array
          description: >
            Target/value mappings for kinds that move values, such as `env`.
          items:
            $ref: '#/components/schemas/ConnectionMapping'
        config:
          $ref: '#/components/schemas/StackConnectionConfig'

    TopologyNodeRef:
      type: object
      description: Identifies a topology node within the stack graph.
      required:
        - type
      properties:
        type:
          type: string
          description: The node category.
          enum:
            - stack_resource
            - addon/postgres
            - secret
            - volume
            - object_store
        id:
          type: string
          description: Stable ID for persisted resources such as addons or secrets.
        name:
          type: string
          description: Name-scoped reference for stack-local resources such as StackResources or Volumes.

    ConnectionMapping:
      type: object
      description: Maps one produced value into one target location on the consumer.
      required:
        - target
        - value
      properties:
        target:
          $ref: '#/components/schemas/ConnectionTarget'
        value:
          $ref: '#/components/schemas/ValueRef'

    ConnectionTarget:
      type: object
      description: The destination field that receives a mapped value.
      required:
        - type
      properties:
        type:
          type: string
          description: env writes an environment variable and file writes a mounted file path.
          enum:
            - env
            - file
        name:
          type: string
          description: Environment variable name when type is env.
        path:
          type: string
          description: Absolute file path when type is file.

    StackConnectionConfig:
      description: >
        Kind-specific connection configuration. The shape depends on the
        connection kind and source type: use PostgresEnvConfig when kind is
        env and from.type is addon/postgres, VolumeMountConfig when kind is
        volume_mount, and BuildArtifactSourceConfig when kind is
        build_artifact_source. Omit config entirely for env connections from
        stack_resource or secret sources.
      oneOf:
        - $ref: '#/components/schemas/PostgresEnvConfig'
        - $ref: '#/components/schemas/VolumeMountConfig'
        - $ref: '#/components/schemas/BuildArtifactSourceConfig'

    PostgresEnvConfig:
      type: object
      description: >
        Config for env connections from a PostgreSQL addon
        (kind=env, from.type=addon/postgres). credential_scope and superuser
        are mutually exclusive.
      properties:
        database:
          type: string
          description: Target database name within the addon.
        credential_scope:
          type: string
          enum:
            - owner
            - superuser
          description: Which credential set to inject. Mutually exclusive with superuser.
        superuser:
          type: boolean
          description: Use superuser credentials. Mutually exclusive with credential_scope.
      additionalProperties: false

    VolumeMountConfig:
      type: object
      description: Config for volume mount connections (kind=volume_mount).
      required:
        - mount_path
      properties:
        mount_path:
          type: string
          description: Absolute path where the volume is mounted in the container.
        sub_path:
          type: string
          description: Sub-path within the volume to mount.
        read_only:
          type: boolean
          description: Mount the volume read-only.
      additionalProperties: false

    BuildArtifactSourceConfig:
      type: object
      description: Config for build artifact source connections (kind=build_artifact_source).
      required:
        - source_path
      properties:
        source_path:
          type: string
          description: Path within the build output to copy from.
        destination_path:
          type: string
          description: Path within the volume to copy to.
      additionalProperties: false

    ValueRef:
      type: object
      description: >
        Describes how to read a value from the connection's `from` node. This is
        only used inside `StackConnection.mappings[]`.
      properties:
        output:
          type: string
          description: Output accessor on the connection's `from` node, such as `url` or `public.http.url`.
        template:
          type: string
          description: Template used when one target value must be composed from multiple outputs.
        values:
          type: object
          description: Named template inputs, each resolving one output from the connection's `from` node.
          additionalProperties:
            $ref: '#/components/schemas/OutputValueRef'

    OutputValueRef:
      type: object
      description: References one output on the connection's `from` node.
      required:
        - output
      properties:
        output:
          type: string
          description: Output accessor on the connection's `from` node.

    ImageBuild:
      type: object
      required:
        - stack_resource_name
        - stack_resource_id
        - source_revision
        - image_repo
        - build_context
      properties:
        id:
