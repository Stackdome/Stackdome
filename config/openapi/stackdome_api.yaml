        - revision
      properties:
        repo_url:
          type: string
        revision:
          $ref: '#/components/schemas/GitRepoRevision'

    GitRepoRevision:
      type: object
      properties:
        branch:
          type: string
        tag:
          type: string
        commit:
          type: string

    RemoteSource:
      type: object
      required:
        - path
        - current_directory_hash
      properties:
        path:
          type: string
        current_directory_hash:
          type: string

    BuildArtifact:
      type: object
      required:
        - resource_ref
        - source_path
        - destination_path
      properties:
        resource_ref:
          type: string
        source_path:
          type: string
        destination_path:
          type: string

    VolumeStatus:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        phase:
          type: string
        build_artifact_syncs:
