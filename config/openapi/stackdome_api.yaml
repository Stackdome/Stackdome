          type: string
    GitInstallation:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        installation_id:
          type: integer
          format: int64
        account_login:
          type: string
        account_type:
          type: string
        repository_selection:
          type: string
        created_at:
          type: string
          format: date-time
