openapi: 3.0.0
info:
  title: stackdome-api-server
  version: 0.0.1
  description: stackdome-api-server
paths:
  /api/v1/users:
    post:
      summary: Create new user
      description: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}:
    get:
      security:
        - Bearer: []
      summary: Get a user
      description: Get a user
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/me:
    get:
      security:
        - Bearer: []
      summary: Get a the current authenticated user
      description: Get a the current authenticated user
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      summary: User login
      description: Authenticate user and generate an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/workspace-users:
    post:
      summary: Create a new workspace user object.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUser'
      responses:
        '201':
          description: WorkspaceUser object added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUser'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /api/v1/workspace-users/{id}:
    get:
      summary: Get a workspace user object by ID
      security:
        - Bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: WorkspaceUser details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUser'
        '401':
          description: Unauthorized
        '404':
          description: WorkspaceUser object not found
        '500':
          description: Internal server error
    put:
      summary: Update a WorkspaceUser
      security:
        - Bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUser'
      responses:
        '200':
          description: WorkspaceUser updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUser'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '404':
          description: WorkspaceUser not found
        '500':
          description: Internal server error
    delete:
      summary: Delete a WorkspaceUser
      security:
        - Bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: WorkspaceUser deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: WorkspaceUser not found
        '500':
          description: Internal server error
  /api/v1/workspace-users/current:
    get:
      summary: Get the workspace user object for the current user
      security:
        - Bearer: []
      responses:
        '200':
          description: WorkspaceUser details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUser'
        '401':
          description: Unauthorized
        '404':
          description: WorkspaceUser object not found
        '500':
          description: Internal server error
  /api/v1/organizations/{id}/workspace-storages:
    post:
      summary: Create a new WorkspaceStorage object
      security:
      - Bearer: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceStorage'
      responses:
        '201':
          description: WorkspaceStorage created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorage'
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    get:
      summary: List all WorkspaceStorage objects for an organization
      security:
        - Bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: workspaceName
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
            enum: [Pending, Creating, Created, Failed]
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceStorage'
                  total:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /api/v1/organizations/{org_id}/workspace-storages/{id}:
    get:
      summary: Get a specific WorkspaceStorage object
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorage'
        '404':
          description: WorkspaceStorage not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    put:
      summary: Update a WorkspaceStorage object
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceStorage'
      responses:
        '200':
          description: WorkspaceStorage updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorage'
        '400':
          description: Invalid request payload
        '404':
          description: WorkspaceStorage not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

    delete:
      summary: Delete a WorkspaceStorage object
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: WorkspaceStorage deleted successfully
        '404':
          description: WorkspaceStorage not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  # List of workspace storages for the current user
  /api/v1/organizations/{org_id}/workspace-storages/current:
    get:
      summary: List all WorkspaceStorage objects for the current user
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStorageList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  
  /api/v1/organizations/{org_id}/workspace-storages/{id}/volumes:
    get:
      summary: List all volumes under a WorkspaceStorage.
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/workspace-storages/{id}/volumes/{volume_id}/mark-as-synced:
    post:
      summary: Mark a volume as synced
      security:
        - Bearer: []
      parameters:
        - in: path
          name: org_id
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: volume_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Volume marked as synced successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/workspaces:
    post:
      summary: Create a new Workspace
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workspace'
      responses:
        '201':
          description: Workspace created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Workspace already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List all Workspaces for an organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/organizations/{org_id}/workspaces/{id}:
    get:
      summary: Get a specific Workspace
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a Workspace
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workspace'
      responses:
        '200':
          description: Workspace updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a Workspace
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Workspace deleted successfully
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # List of all workspaces for the current user
  /api/v1/organizations/{org_id}/workspaces/current:
    get:
      summary: List all Workspaces for the current user
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/organizations/{org_id}/workspaces/{workspace_id}/resources:
    get:
      summary: List all WorkspaceResources for a Workspace
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/workspace_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResourceList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /api/v1/organizations/{org_id}/workspaces/{workspace_id}/resources/{id}:
    put:
      summary: Update a WorkspaceResource
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/workspace_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceResource'
      responses:
        '200':
          description: WorkspaceResource updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResource'
        '401':
          description: Unauthorized
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/organizations/{org_id}/workspaces/{workspace_id}/resources/{id}/builds:
    get:
      summary: List all builds for a WorkspaceResource
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/workspace_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResourceBuildList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

 # List all builds under a workspace
  /api/v1/organizations/{org_id}/workspaces/{workspace_id}/builds:
    get:
      summary: List all builds under a workspace
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/workspace_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResourceBuildList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/organizations/{org_id}/workspaces/{workspace_id}/builds/{build_id}:
  # get a specific build under a workspace
    get:
      summary: Get a specific build under a workspace
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/workspace_id'
        - in: path
          name: build_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResourceBuild'
        '401':
          description: Unauthorized
        '404':
          description: Build not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    org_id:
      name: org_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the organization
    workspace_id:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the workspace
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: User's ID
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        organisation:
          type: string
          description: User's organisation
        role:
          type: string
          description: User's role
        organisation_id:
          type: string
          description: OrganisationID
    UserCreateRequest:
      type: object
      required:
      - name
      - email
      - password
      - organisation_id
      properties:
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: Users desired password
        organisation:
          type: string
          description: User's organisation
        organisation_id:
          type: string
          description: OrganisationID
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email
        password:
          type: string
          format: password
          description: User's password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Access token for authenticated requests
        expires_in:
          type: integer
          description: Token expiration time in seconds
    WorkspaceUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        org_id:
          type: string
        ssh_public_key:
          type: string
        workspaces:
          type: array
          minItems: 1
          items:
            type: string
        version:
          readOnly: true
          type: integer
        status:
          $ref: '#/components/schemas/WorkspaceUserStatus'
        state:
          $ref: '#/components/schemas/WorkspaceUserState'
        message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - ssh_public_key
        - workspaces
    WorkspaceUserState:
      type: string
      enum:
      - Completed
      - Error
      - Pending
    WorkspaceUserStatus:
      type: object
      properties:
        observed_version:
          type: integer
        provisioned_namespaces:
          type: array
          items:
            type: object
            properties:
              workspace_name:
                type: string
              namespace:
                type: string
        service_account_name:
          type: string
          nullable: true
        serviceaccount_token:
          type: string
          nullable: true
        cluster_ca_cert:
          type: string
          nullable: true
        cluster_url:
          type: string
          nullable: true
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
    Cluster:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        organisation_id:
          type: string
        default:
          type: boolean
        cluster_url:
          type: string
        cluster_ca_data:
          type: string
        client_cert_data:
          type: string
        client_key_data:
          type: string
    
    WorkspaceStorage:
      type: object
      additionalProperties: false
      required:
        - name
        - spec
      properties:
        id:
          type: string
          readOnly: true
        organisation_id:
          type: string
          readOnly: true
        name:
          type: string
        namespace:
          readOnly: true
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        version:
          type: integer
          readOnly: true
        spec:
          $ref: '#/components/schemas/WorkspaceStorageSpec'
        status:
          $ref: '#/components/schemas/WorkspaceStorageStatus'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    WorkspaceStorageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceStorage'
        total:
          type: integer

    WorkspaceStorageSpec:
      type: object
      required:
        - workspace_name
      properties:
        workspace_name:
          type: string
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/Volume'

    WorkspaceStorageState:
      type: string
      enum:
      - StoragePending
      - StorageCreating
      - StorageCreated
      - StorageReady
      - StorageFailed

    Volume:
      type: object
      additionalProperties: false
      required:
        - name
        - spec
      properties:
        name:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        annotations:
