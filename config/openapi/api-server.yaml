openapi: 3.0.0
info:
  title: api-server
  version: 0.0.1
  description: api-server
paths:
  /api/v1/user:
    post:
      summary: Create new user
      description: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/{id}:
    get:
      security:
        - Bearer: []
      summary: Get a user
      description: Get a user
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      summary: User login
      description: Authenticate user and generate an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: User's ID
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        organisation:
          type: string
          description: User's organisation
        role:
          type: string
          description: User's role
    UserCreateRequest:
      type: object
      required:
      - name
      - email
      - password
      properties:
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: Users desired password
        organisation:
          type: string
          description: User's organisation
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email
        password:
          type: string
          format: password
          description: User's password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Access token for authenticated requests
        expiresIn:
          type: integer
          description: Token expiration time in seconds

    Error:
      allOf:
        - $ref: '#/components/schemas/ObjectReference'
        - type: object
          properties:
            code:
              type: string
            reason:
              type: string
            operation_id:
              type: string
    ErrorList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Error'
      allOf:
        - $ref: '#/components/schemas/List'
    List:
      type: object
      properties:
        kind:
          type: string
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
      required:
        - kind
        - page
        - size
        - total
        - items
    ObjectReference:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        href:
          type: string