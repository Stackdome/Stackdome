openapi: 3.0.0
info:
  description: "Deploy, debug, and operate applications through the Stackdome REST\
    \ API on Stackdome Cloud or a self-hosted installation. This API is in alpha and\
    \ may change before general availability."
  title: Stackdome API
  version: 0.0.1-alpha
servers:
- url: /
paths:
  /api/v1/user-signup:
    post:
      description: Create a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSignupResponse'
          description: User created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request data
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: User already exists
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Create new user
  /api/v1/config:
    get:
      description: "Returns feature flags the web client needs before authentication,\
        \ such as whether GitHub OAuth is enabled."
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
          description: Application configuration
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Get public application configuration
  /api/v1/users/{id}:
    get:
      description: Get a user
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User fetched successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a user
  /api/v1/users/current:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User fetched successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Get the current authenticated user
  /api/v1/users/current/projects:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
          description: Projects listed successfully
        "401":
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: List projects for the current authenticated user
  /api/v1/auth/login:
    post:
      description: Authenticate user and generate an access token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful login
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: User login
  /api/v1/auth/refresh:
    post:
      description: Exchange a refresh token for a new access token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
          description: Token refreshed successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid or expired refresh token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Refresh JWT token
  /api/v1/auth/github:
    get:
      description: Redirects the user to GitHub for OAuth authorization
      responses:
        "302":
          description: Redirect to GitHub OAuth authorization page
        "500":
          description: Internal server error
      summary: Initiate GitHub OAuth flow
  /api/v1/auth/github/callback:
    get:
      description: Handles the callback from GitHub after OAuth authorization
      parameters:
      - explode: true
        in: query
        name: code
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: state
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: OAuth login successful
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: OAuth authorization failed
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: GitHub OAuth callback
  /api/v1/api-tokens:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenList'
          description: API tokens listed successfully
      security:
      - Bearer: []
      summary: List all API tokens for the current user
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenCreateResponse'
          description: API token created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request data
      security:
      - Bearer: []
      summary: Create a new API token
  /api/v1/api-tokens/scopes:
    get:
      description: Returns the list of resources and their allowed actions that can
        be used when creating API tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeList'
          description: Scopes listed successfully
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      summary: List all available API token scopes
  /api/v1/api-tokens/{id}:
    delete:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: API token revoked successfully
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: API token not found
      security:
      - Bearer: []
      summary: Revoke an API token
    get:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
          description: API token fetched successfully
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: API token not found
      security:
      - Bearer: []
      summary: Get an API token by ID
  /api/v1/organizations/{id}:
    get:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
          description: Organization fetched successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Get an organization
    put:
      parameters:
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organisation'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
          description: Organization updated successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: Update an organization
  /api/v1/organizations/{org_id}/users:
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: Page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - description: Number of items per page
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
          description: Successful operation
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: List all users in an organization
  /api/v1/organizations/{org_id}/secrets:
    get:
      description: Returns secrets from all projects the user belongs to. OrgAdmins
        see all secrets in the org.
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: Filter by secret name
        explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretList'
          description: Successful operation
        "401":
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - Bearer: []
      summary: List all secrets the user has access to across all projects
  /api/v1/organizations/{org_id}/registry-credentials:
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialList'
          description: Successful operation
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: List registry credentials for the organization
    post:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredential'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredential'
          description: Registry credential created successfully
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A credential for this host and purpose already exists
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Create a registry credential for the organization
  /api/v1/organizations/{org_id}/registry-credentials/{id}:
    delete:
      description: Deletion is never blocked; the response lists stacks that were
        implicitly resolving against this credential so rotations are visible.
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentialDeleteResponse'
          description: Registry credential deleted successfully
        "404":
          description: Registry credential not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Delete a registry credential
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredential'
          description: Successful operation
        "404":
          description: Registry credential not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Get a registry credential
    put:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredential'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredential'
          description: Registry credential updated successfully
        "400":
          description: Invalid request payload
        "404":
          description: Registry credential not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Update a registry credential (username/password rotation)
  /api/v1/organizations/{org_id}/registry-credentials/{id}/verify:
    post:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredentialVerifyRequest'
        required: true
      responses:
        "204":
          description: Credential verified successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Verification failed
        "404":
          description: Registry credential not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Verify a registry credential against a repository
  /api/v1/organizations/{org_id}/git-integrations/github/manifest:
    post:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppManifestFlow'
          description: Manifest flow started
        "400":
          description: The hub external URL is not configured
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: A GitHub App is already installed
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Start the GitHub App manifest flow for the organization
  /api/v1/git-integrations/github/manifest/callback:
    get:
      parameters:
      - explode: true
        in: query
        name: code
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: state
        required: true
        schema:
          type: string
        style: form
      responses:
        "302":
          description: Redirects the browser to the GitHub App install page
        "400":
          description: Invalid or expired state
        "500":
          description: Internal server error
      summary: "GitHub App manifest redirect target (unauthenticated, state-validated)"
  /api/v1/git-integrations/github/setup:
    get:
      parameters:
      - explode: true
        in: query
        name: installation_id
        required: true
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: state
        required: true
        schema:
          type: string
        style: form
      responses:
        "302":
          description: Redirects the browser back to the git integrations page
        "400":
          description: Invalid or expired state
        "404":
          description: The installation was not found on the platform app
        "500":
          description: Internal server error
      summary: "Platform GitHub App setup redirect target (unauthenticated, state-validated)"
  /api/v1/webhooks/github:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: true
      responses:
        "202":
          description: Delivery accepted
        "403":
          description: Signature verification failed
        "500":
          description: Internal server error
      summary: "GitHub webhook receiver (unauthenticated, HMAC-verified)"
  /api/v1/organizations/{org_id}/git-integrations/{id}/installations:
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Re-list installations from GitHub before returning (covers missed
          webhooks)
        explode: true
        in: query
        name: refresh
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitInstallationList'
          description: Successful operation
        "404":
          description: Git integration not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: List GitHub App installations
  /api/v1/organizations/{org_id}/git-integrations/{id}/repositories:
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: "Our GitInstallation id (UUID). When omitted, repositories are\
          \ aggregated across every installation of the integration."
        explode: true
        in: query
        name: installation_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepositoryPage'
          description: Successful operation
        "404":
          description: Git integration not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: List repositories visible to the GitHub App installation
  /api/v1/organizations/{org_id}/git-integrations/{id}/repositories/{owner}/{repo}:
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: owner
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: repo
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepository'
          description: Successful operation
        "404":
          description: Not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: Get repository details through the GitHub App installation
  /api/v1/organizations/{org_id}/git-integrations/{id}/repositories/{owner}/{repo}/branches:
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id of record
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: owner
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: repo
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitBranchList'
          description: Successful operation
        "404":
          description: Not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - Bearer: []
      summary: List repository branches through the GitHub App installation
  /api/v1/organizations/{org_id}/git-integrations:
    get:
      parameters:
      - description: The ID of the organization
        explode: false
        in: path
        name: org_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitIntegrationList'
          description: Successful operation
