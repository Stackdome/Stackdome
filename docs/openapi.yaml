    org_id:
      description: The ID of the organization
      explode: false
      in: path
      name: org_id
      required: true
      schema:
        type: string
      style: simple
    cluster_id:
      description: The ID of the cluster
      explode: false
      in: path
      name: cluster_id
      required: true
      schema:
        type: string
      style: simple
    project_name:
      description: The name of the project
      explode: false
      in: path
      name: project_name
      required: true
      schema:
        type: string
      style: simple
    user_id:
      description: The ID of the user
      explode: false
      in: path
      name: user_id
      required: true
      schema:
        type: string
      style: simple
    resource_name:
      description: The name of the stack resource
      explode: false
      in: path
      name: resource_name
      required: true
      schema:
        type: string
      style: simple
    connection_id:
      description: The ID of the stack connection
      explode: false
      in: path
