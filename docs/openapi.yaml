          description: True when GitHub OAuth login is configured on the server.
          type: boolean
      type: object
    Organisation:
      example:
        updated_at: 2000-01-23T04:56:07.000+00:00
        is_platform: true
        name: name
        domains:
        - fqdn: fqdn
          id: id
        - fqdn: fqdn
          id: id
        created_at: 2000-01-23T04:56:07.000+00:00
        id: id
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          items:
            $ref: '#/components/schemas/DomainName'
          type: array
