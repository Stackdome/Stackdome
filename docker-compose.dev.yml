# docker-compose.dev.yml
# Optional dev infrastructure for working on Object Stores / Postgres backups.
# Brings up MinIO (S3-compatible) on :9000 and its console on :9001, and
# bootstraps a `stackdome-backups` bucket.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   open http://localhost:9001  (login: minioadmin / minioadmin)

services:
  minio:
    image: minio/minio:latest
    container_name: stackdome-dev-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    image: minio/mc:latest
    container_name: stackdome-dev-minio-bootstrap
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      sh -c '
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          echo "waiting for minio..."; sleep 1;
        done;
        mc mb -p local/stackdome-backups || true;
        echo "bootstrap complete";
      '

volumes:
  minio-data:
